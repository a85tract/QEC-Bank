      },
      "content": {
        "description": "Perfect gauge readout reduces the two Pauli channels to classical repetition inference in perpendicular directions. A bare logical X may be placed on any complete row and a bare logical Z on any complete column; parallel representatives differ only by gauge action. The engine constructs the protected quotient C(S)/G, exactly enumerates the three shipped finite instances, and independently validates any seeded upper-bound witness. Scalable lower bounds and presentation-equivalence certificates remain open under wanted/subsystem-dressed-distance.",
        "origin": {
          "converter": "qeclib.gf2.rank + Bacon–Shor gauge-span and logical-pair checks",
          "kind": "derived",
          "version": "v1"
        },
        "refs": [
          "bacon2006operator",
          "aliferis2007subsystem",
          "napp2013optimal"
        ],
        "rung": "R2",
        "type": "repetition-quotient"
