      "version_id": "atlas-assertion:bacon_shor:relations:0@sha256:c72c328cb56f36e365b5247f66eebe77d36ee849a4ce6d3ebf519f0a4deac024"
    },
    {
      "applies_to": {
        "id": "eczoo-entity:bacon_shor#collection",
        "kind": "entity"
      },
      "content": {
        "how": "Plain rectangular Bacon–Shor occupies every site of the defining binary matrix. Bravyi–Bacon–Shor permits a general occupancy matrix and derives encoded dimension and distances from its row and column codes, so its rate claims do not transfer to the full rectangle.",
        "refs": [
          "bravyi2011subsystem",
          "yoder2019optimal"
        ],
        "target": "bravyi_bacon_shor",
        "type": "special_case_of"
      },
      "evidence_id": "atlas-evidence:bacon_shor:relations:1@c9a189b7114fbbe9e972a7de50946c7b7a12f6a583368474c679b47be8bddf00",
