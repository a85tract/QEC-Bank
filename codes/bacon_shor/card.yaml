    {
      "applies_to": {
        "id": "eczoo-entity:bacon_shor#collection",
        "kind": "entity"
      },
      "content": {
        "how": "Promoting selected gauge generators to commuting stabilizers produces two-dimensional compass-code descendants between the Bacon–Shor and surface-like extremes. The pattern of promoted checks is part of the target code and is not encoded by changing only rows and columns here.",
        "refs": [
          "li2019compass"
