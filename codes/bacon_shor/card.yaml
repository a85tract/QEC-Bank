      "content": {
        "description": "Vertical XX pairs and horizontal ZZ pairs generate a nonabelian gauge group. Multiplying every vertical pair across two neighboring rows gives an X stabilizer; multiplying every horizontal pair across two neighboring columns gives a Z stabilizer. The constructor verifies that these center generators commute with the full gauge group and lie in its span.",
