  "source": {
    "collection": "atlas",
    "encoding": "utf-8",
    "entry_id": "bacon_shor",
    "path": "atlas/bacon_shor/card.yaml",
    "sha256": "6c1eb3bbcdca40c92763fd641e73f3ab8df3925946097924e3c4589af68393a4",
    "text": "id: bacon_shor\nkind: family\nidentity:\n  canonical_name: \"Bacon–Shor code\"\n  variant: \"rectangular static subsystem family\"\n  aliases:\n    - \"Bacon–Shor subsystem code\"\n    - \"operator Bacon–Shor code\"\npresentation:\n  orienting_view: {status: available, kind: construction}\n  guided_tour: {status: available}\neczoo:\n  status: mapped\n  zoo_id: bacon_shor\n  classification: exact-family\n  source:\n    repository_url: https://github.com/errorcorrectionzoo/eczoo_data\n    commit: b2437d9e2dc09284e04c66ef72ee81b7ed7bd129\n    retrieved_on: \"2026-08-05\"\n    path: codes/quantum/qubits/subsystem/qldpc/bbs/bacon_shor/bacon_shor.yml\n    sha256: 782d484a02dea609d14e25c28d1c59e8c11d0ad4202b057a9e035d0c4ec92009\n    page_url: https://errorcorrectionzoo.org/c/bacon_shor\n    blob_url: https://github.com/errorcorrectionzoo/eczoo_data/blob/b2437d9e2dc09284e04c66ef72ee81b7ed7bd129/codes/quantum/qubits/subsystem/qldpc/bbs/bacon_shor/bacon_shor.yml\ndescription: >-\n  A rectangular grid code that makes Shor's two repetition protections local\n  by treating nearest-neighbour XX and ZZ parities as gauge generators. These\n  gauge measurements need not commute with one another: only their center\n  fixes the protected subspace. The unconstrained gauge subsystem absorbs\n  local changes of representative, while one row-spanning X string and one\n  column-spanning Z string carry the logical qubit.\nviews:\n  - rung: R1\n    type: gauge-center-quotient\n    description: >-\n      Vertical XX pairs and horizontal ZZ pairs generate a nonabelian gauge\n      group. Multiplying every vertical pair across two neighboring rows gives\n      an X stabilizer; multiplying every horizontal pair across two neighboring\n      columns gives a Z stabilizer. The constructor verifies that these center\n      generators commute with the full gauge group and lie in its span.\n    origin: {kind: canonical}\n    refs: [bacon2003decoherence, bacon2006operator, aliferis2007subsystem]\n  - rung: R2\n    type: repetition-quotient\n    description: >-\n      Perfect gauge readout reduces the two Pauli channels to classical\n      repetition inference in perpendicular directions. A bare logical X may\n      be placed on any complete row and a bare logical Z on any complete\n      column; parallel representatives differ only by gauge action. The engine\n      constructs the protected quotient C(S)/G, exactly enumerates the three\n      shipped finite instances, and independently validates any seeded\n      upper-bound witness. Scalable lower bounds and presentation-equivalence\n      certificates remain open under wanted/subsystem-dressed-distance.\n    origin:\n      kind: derived\n      converter: \"qeclib.gf2.rank + Bacon–Shor gauge-span and logical-pair checks\"\n      version: \"v1\"\n    refs: [bacon2006operator, aliferis2007subsystem, napp2013optimal]\n  - rung: R5\n    type: compass-hamiltonian\n    description: >-\n      Reading the same XX/ZZ links as Hamiltonian terms produces the square\n      quantum-compass pattern and its rigid line symmetries. This dictionary\n      does not turn the ordinary static Bacon–Shor model into a topological or\n      self-correcting memory; locality belongs to the gauge generators, while\n      the stabilizer products grow with a linear dimension.\n    origin: {kind: curated, ref: dorier2005compass}\n    refs: [dorier2005compass, bacon2006operator, sarma2013gauge]\n  - rung: R5\n    type: tensor-leg-reassignment\n    description: >-\n      A surface-code tensor network can be reorganized by declaring selected\n      dangling legs logical rather than physical. The reassignment exposes the\n      Bacon–Shor weight-two gauge structure and explains the relationship as a\n      change of subsystem bookkeeping, not an equality of stabilizer tables.\n    origin: {kind: curated, ref: cao2022quantumlego}\n    refs: [cao2022quantumlego]\n  - rung: R5\n    type: frustration-graph-boundary\n    description: >-\n      The gauge-term anticommutation graph records which perpendicular XX and\n      ZZ links meet once. It is a useful contrast with free-fermion subsystem\n      constructions, but the ordinary Bacon–Shor compass Hamiltonian itself is\n      not labeled free-fermion solvable: the fetched source explicitly treats\n      it as the obstructed relative as of 2026-08-02.\n    origin: {kind: curated, ref: chapman2022freefermion}\n    refs: [chapman2022freefermion]\n  - rung: R3\n    type: period-four-descendant\n    description: >-\n      Floquet–Bacon–Shor replaces the static gauge-center object with a\n      period-four measurement schedule whose detectors and logical\n      representatives evolve in time. Its superconducting logical-operation\n      demonstration is therefore evidence for a dynamical descendant, not a\n      hardware realization of this card's static check matrix.\n    origin: {kind: curated, ref: alam2025board}\n    refs: [alam2025board, sun2025floquetbacon]\ncategories:\n  - {id: subsystem, origin: {kind: curated, ref: bacon2006operator}}\n  - {id: css, origin: {kind: verified}}\nrefs:\n  - shor1995scheme\n  - bacon2003decoherence\n  - bacon2006operator\n  - aliferis2007subsystem\n  - cross2009comparative\n  - napp2013optimal\n  - brooks2013asymmetric\n  - bravyi2011subsystem\n  - li2019compass\n  - yoder2019optimal\n  - alam2025board\n  - escobar2025improved\n  - gidney2023less\n  - dorier2005compass\n  - sarma2013gauge\n  - cao2022quantumlego\n  - chapman2022freefermion\n  - egan2021fault\n  - sun2025floquetbacon\n  - yoder2017universalbacon\n  - nautrup2017interface\n  - veroni2025measurementfree\nparams:\n  rows: \"Number of physical-qubit rows; at least two.\"\n  columns: \"Number of physical-qubit columns; at least two.\"\nvisual_instance: square_3\ntier: T3\nfit:\n  platforms:\n    - nearest-neighbour-square-array\n    - trapped-ion-all-to-all\n    - bias-preserving-architecture\n  tasks:\n    - fault-tolerant-memory\n    - bias-tailored-protection\n    - logical-operations\ndecoders:\n  - id: lookup-table\n    status: standard\n    noise: >-\n      finite rectangular blocks with perfect two-qubit gauge outcomes under\n      stochastic Pauli noise\n    notes: >-\n      The exact-small decision rule factorizes into repetition-style parity\n      inference along rows and columns; it may be implemented by majority\n      logic instead of literally storing a table. The optimum rectangle is a\n      property of the X/Z noise bias and objective, not a code-only constant.\n    refs: [aliferis2007subsystem, napp2013optimal]\n  - id: lookup-table\n    status: research-grade\n    noise: >-\n      circuit faults in repeated low-weight gauge extraction or encoded-ancilla\n      Steane extraction on fixed small blocks\n    notes: >-\n      Here the input includes a protocol-specific history of gauge outcomes,\n      flags, or encoded-ancilla checks. Repeating gauge measurements and using\n      a Steane ancilla are different syndrome objects, so their logical-error\n      comparisons cannot be transferred to an unspecified static decoder.\n    refs: [cross2009comparative, escobar2025improved]\n  - id: mwpm\n    status: research-grade\n    noise: >-\n      uniform circuit-level noise on the period-four Floquet–Bacon–Shor\n      descendant\n    notes: >-\n      Matching consumes constant-weight spacetime detectors built from the\n      scheduled circuit. This row is intentionally variant-scoped: it does not\n      establish a conventional threshold for the static rectangular family.\n      No extraction-independent threshold for plain static stabilizer products\n      was found in the stated searches as of 2026-08-02.\n    refs: [alam2025board, gidney2023less]\nrealizations:\n  - platform: \"thirteen-qubit trapped-ion processor\"\n    status: demonstrated\n    description: >-\n      A nine-data-qubit Bacon–Shor logical block with four ancillas demonstrated\n      fault-tolerant preparation, measurement, corrected rotations, and\n      stabilizer extraction. This is a fixed-distance primitive suite, not an\n      increasing-distance below-threshold memory experiment.\n    refs: [egan2021fault]\n  - platform: \"bias-preserving teleportation architecture\"\n    status: proposed\n    description: >-\n      Highly rectangular blocks are combined with teleportation and biased\n      elementary operations so geometry protects the dominant Pauli channel.\n      The resource claim includes ancilla preparation, verification, and\n      correction; it is not supplied by block aspect ratio alone.\n    refs: [brooks2013asymmetric]\nrelations:\n  - type: gauge_fixes_to\n    target: shor_nine\n    how: >-\n      For the square three-by-three member in this constructor's orientation,\n      promote all horizontal ZZ gauge pairs to stabilizers. Together with the\n      two X center generators, they reproduce the repository's nine-qubit Shor\n      stabilizer row space exactly; the discarded gauge freedom becomes fixed.\n      The neighboring Shor entry uses encoded-basis names that call the Z\n      column logical X and the X row logical Z, so its logical labels are\n      swapped relative to this card's Pauli-type names even though the\n      protected Pauli algebra is the same.\n    refs: [shor1995scheme, bacon2006operator]\n  - type: special_case_of\n    target: bravyi_bacon_shor\n    how: >-\n      Plain rectangular Bacon–Shor occupies every site of the defining binary\n      matrix. Bravyi–Bacon–Shor permits a general occupancy matrix and derives\n      encoded dimension and distances from its row and column codes, so its\n      rate claims do not transfer to the full rectangle.\n    refs: [bravyi2011subsystem, yoder2019optimal]\n  - type: gauge_fixes_to\n    target: compass_code_2d\n    how: >-\n      Promoting selected gauge generators to commuting stabilizers produces\n      two-dimensional compass-code descendants between the Bacon–Shor and\n      surface-like extremes. The pattern of promoted checks is part of the\n      target code and is not encoded by changing only rows and columns here.\n    refs: [li2019compass]\n  - type: product_of\n    target: repetition\n    how: >-\n      The protected X and Z parities are perpendicular repetition constraints,\n      with local pair checks liberated into a gauge subsystem. This quotient is\n      the subsystem analogue of Shor's nested repetition construction rather\n      than an HGP replay recipe.\n    refs: [shor1995scheme, bacon2006operator]\noperations:\n  - gate: \"CNOT between aligned Bacon–Shor blocks\"\n    mechanism: transversal\n    level: \"Clifford\"\n    cost: >-\n      one pairwise physical-CNOT layer between matching grid sites; block\n      alignment, routing, syndrome extraction, and recovery are additional\n    origin: {kind: claimed, ref: aliferis2007subsystem}\n  - gate: \"H on a square block\"\n    mechanism: transversal\n    level: \"Clifford\"\n    cost: >-\n      one physical-H layer followed by the row/column permutation that restores\n      the declared vertical-X and horizontal-Z gauge orientation\n    origin: {kind: claimed, ref: aliferis2007subsystem}\n  - gate: \"multi-controlled Z family on dimension-matched rectangles\"\n    mechanism: transversal\n    level: \"non-Clifford controlled-phase hierarchy\"\n    cost: >-\n      block dimensions must satisfy the cited geometry for the chosen control\n      order; changing aspect ratio and performing error correction between\n      pieces are protocol resources, not free transversal gates on one square\n    origin: {kind: claimed, ref: yoder2017universalbacon}\n  - gate: \"joint logical parity and state transfer\"\n    mechanism: surgery\n    level: \"measurement-based Clifford interface\"\n    cost: >-\n      a compatible boundary, an ancilla code patch, repeated joint gauge\n      measurements, and classical feed-forward\n    origin: {kind: claimed, ref: nautrup2017interface}\n  - gate: \"biased-noise universal primitives\"\n    mechanism: measurement-based\n    level: \"teleportation-assisted universal set\"\n    cost: >-\n      verified ancillas, teleportation measurements, and correction around\n      strongly rectangular blocks; the aspect ratio is optimized jointly with\n      the hardware noise bias\n    origin: {kind: claimed, ref: brooks2013asymmetric}\n  - gate: \"CCZ by measurement-free deformation\"\n    mechanism: switching\n    level: \"non-Clifford\"\n    cost: >-\n      coherent correction circuits and extra qubits replace mid-circuit\n      measurement while the code is deformed; measurement-free does not mean\n      correction-free\n    origin: {kind: claimed, ref: veroni2025measurementfree}\n  - gate: \"logical operations on the Floquet–Bacon–Shor descendant\"\n    mechanism: measurement-based\n    level: \"dynamical logical control (variant only)\"\n    cost: >-\n      a period-four measurement schedule, time-dependent logical tracking, and\n      detector decoding; this operation is not attached to the static\n      checkmatrix exported by this entry\n    origin: {kind: claimed, ref: sun2025floquetbacon}\n",
    "version": "qec-atlas-card-v1"
  },
