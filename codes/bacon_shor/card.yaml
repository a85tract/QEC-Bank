      },
      "content": {
        "description": "A nine-data-qubit Bacon–Shor logical block with four ancillas demonstrated fault-tolerant preparation, measurement, corrected rotations, and stabilizer extraction. This is a fixed-distance primitive suite, not an increasing-distance below-threshold memory experiment.",
        "platform": "thirteen-qubit trapped-ion processor",
