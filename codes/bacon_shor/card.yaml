      },
      "content": {
        "description": "Highly rectangular blocks are combined with teleportation and biased elementary operations so geometry protects the dominant Pauli channel. The resource claim includes ancilla preparation, verification, and correction; it is not supplied by block aspect ratio alone.",
        "platform": "bias-preserving teleportation architecture",
        "refs": [
