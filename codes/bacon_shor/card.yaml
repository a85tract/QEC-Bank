    "relations": [
      {
        "how": "For the square three-by-three member in this constructor's orientation, promote all horizontal ZZ gauge pairs to stabilizers. Together with the two X center generators, they reproduce the repository's nine-qubit Shor stabilizer row space exactly; the discarded gauge freedom becomes fixed. The neighboring Shor entry uses encoded-basis names that call the Z column logical X and the X row logical Z, so its logical labels are swapped relative to this card's Pauli-type names even though the protected Pauli algebra is the same.",
        "refs": [
          "shor1995scheme",
          "bacon2006operator"
        ],
        "target": "shor_nine",
        "type": "gauge_fixes_to"
      },
      {
        "how": "Plain rectangular Bacon–Shor occupies every site of the defining binary matrix. Bravyi–Bacon–Shor permits a general occupancy matrix and derives encoded dimension and distances from its row and column codes, so its rate claims do not transfer to the full rectangle.",
        "refs": [
          "bravyi2011subsystem",
          "yoder2019optimal"
        ],
        "target": "bravyi_bacon_shor",
        "type": "special_case_of"
      },
      {
        "how": "Promoting selected gauge generators to commuting stabilizers produces two-dimensional compass-code descendants between the Bacon–Shor and surface-like extremes. The pattern of promoted checks is part of the target code and is not encoded by changing only rows and columns here.",
        "refs": [
          "li2019compass"
        ],
        "target": "compass_code_2d",
        "type": "gauge_fixes_to"
      },
      {
        "how": "The protected X and Z parities are perpendicular repetition constraints, with local pair checks liberated into a gauge subsystem. This quotient is the subsystem analogue of Shor's nested repetition construction rather than an HGP replay recipe.",
        "refs": [
          "shor1995scheme",
          "bacon2006operator"
        ],
        "target": "repetition",
        "type": "product_of"
      }
    ],
    "tier": "T3",
    "views": [
      {
        "description": "Vertical XX pairs and horizontal ZZ pairs generate a nonabelian gauge group. Multiplying every vertical pair across two neighboring rows gives an X stabilizer; multiplying every horizontal pair across two neighboring columns gives a Z stabilizer. The constructor verifies that these center generators commute with the full gauge group and lie in its span.",
        "origin": {
          "kind": "canonical"
        },
        "refs": [
          "bacon2003decoherence",
          "bacon2006operator",
          "aliferis2007subsystem"
        ],
        "rung": "R1",
        "type": "gauge-center-quotient"
      },
      {
        "description": "Perfect gauge readout reduces the two Pauli channels to classical repetition inference in perpendicular directions. A bare logical X may be placed on any complete row and a bare logical Z on any complete column; parallel representatives differ only by gauge action. The engine constructs the protected quotient C(S)/G, exactly enumerates the three shipped finite instances, and independently validates any seeded upper-bound witness. Scalable lower bounds and presentation-equivalence certificates remain open under wanted/subsystem-dressed-distance.",
        "origin": {
          "converter": "qeclib.gf2.rank + Bacon–Shor gauge-span and logical-pair checks",
          "kind": "derived",
          "version": "v1"
        },
        "refs": [
          "bacon2006operator",
          "aliferis2007subsystem",
          "napp2013optimal"
        ],
        "rung": "R2",
        "type": "repetition-quotient"
      },
      {
        "description": "Reading the same XX/ZZ links as Hamiltonian terms produces the square quantum-compass pattern and its rigid line symmetries. This dictionary does not turn the ordinary static Bacon–Shor model into a topological or self-correcting memory; locality belongs to the gauge generators, while the stabilizer products grow with a linear dimension.",
        "origin": {
          "kind": "curated",
          "ref": "dorier2005compass"
        },
        "refs": [
          "dorier2005compass",
          "bacon2006operator",
          "sarma2013gauge"
        ],
        "rung": "R5",
        "type": "compass-hamiltonian"
      },
      {
        "description": "A surface-code tensor network can be reorganized by declaring selected dangling legs logical rather than physical. The reassignment exposes the Bacon–Shor weight-two gauge structure and explains the relationship as a change of subsystem bookkeeping, not an equality of stabilizer tables.",
        "origin": {
          "kind": "curated",
          "ref": "cao2022quantumlego"
        },
        "refs": [
          "cao2022quantumlego"
        ],
        "rung": "R5",
        "type": "tensor-leg-reassignment"
      },
      {
        "description": "The gauge-term anticommutation graph records which perpendicular XX and ZZ links meet once. It is a useful contrast with free-fermion subsystem constructions, but the ordinary Bacon–Shor compass Hamiltonian itself is not labeled free-fermion solvable: the fetched source explicitly treats it as the obstructed relative as of 2026-08-02.",
        "origin": {
          "kind": "curated",
          "ref": "chapman2022freefermion"
        },
        "refs": [
          "chapman2022freefermion"
        ],
        "rung": "R5",
        "type": "frustration-graph-boundary"
      },
      {
        "description": "Floquet–Bacon–Shor replaces the static gauge-center object with a period-four measurement schedule whose detectors and logical representatives evolve in time. Its superconducting logical-operation demonstration is therefore evidence for a dynamical descendant, not a hardware realization of this card's static check matrix.",
