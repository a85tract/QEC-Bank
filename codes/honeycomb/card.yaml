    "entry_id": "honeycomb",
    "path": "atlas/honeycomb/card.yaml",
    "sha256": "77412d98fd4ee84263a3109af32a55cbb8ae35a97766a2258da32bb6ed771749",
    "text": "id: honeycomb\nkind: family\nidentity:\n  canonical_name: \"Honeycomb Floquet code\"\n  aliases: [\"Hastings-Haah code\"]\npresentation:\n  orienting_view: {status: available, kind: schedule}\n  guided_tour: {status: available}\neczoo:\n  status: mapped\n  zoo_id: honeycomb_floquet\n  classification: exact-family\n  source:\n    repository_url: https://github.com/errorcorrectionzoo/eczoo_data\n    commit: b2437d9e2dc09284e04c66ef72ee81b7ed7bd129\n    retrieved_on: \"2026-08-05\"\n    path: codes/quantum/qubits/dynamic/floquet/2d/honeycomb_floquet.yml\n    sha256: 0c6302b2689249c3dd9111e9eda8269997761f7a605f6504cdff69c170a0a298\n    page_url: https://errorcorrectionzoo.org/c/honeycomb_floquet\n    blob_url: https://github.com/errorcorrectionzoo/eczoo_data/blob/b2437d9e2dc09284e04c66ef72ee81b7ed7bd129/codes/quantum/qubits/dynamic/floquet/2d/honeycomb_floquet.yml\ndescription: >-\n  A period-three dynamical stabilizer memory made only from weight-two Pauli\n  measurements on a honeycomb torus. Edge operators are fixed as XX, YY, or\n  ZZ by direction, while a plaquette three-coloring partitions them into\n  three perfect-matching rounds. The code is the ordered schedule and its\n  outcome-dependent instantaneous stabilizer group, not any one static set of\n  mutually commuting edge checks; after startup that group carries two\n  toric-code logical qubits.\nclaim_gaps:\n  - {property: d, target: wanted:floquet-fault-distance}\nviews:\n  - rung: R1\n    type: steady-isg-checks\n    description: >-\n      After the declared startup, the constructor exports independent\n      sign-free Pauli generators for one instantaneous stabilizer group as a\n      symplectic CheckMatrix. This is the universal R1 snapshot for rank and\n      commutation; it does not determine the protocol's spacetime distance.\n    origin:\n      kind: derived\n      converter: \"honeycomb.build Schedule -> ISGTracker steady snapshot\"\n      version: \"v1\"\n    refs: [hastings2021dynamically]\n  - rung: R3\n    type: schedule-isg\n    description: >-\n      The executable object is a three-round Schedule. An incoming matching\n      replaces anticommuting generators in the instantaneous stabilizer group\n      while preserving a rank-eight plaquette backbone; this view distinguishes\n      the dynamical code from a frozen check matrix.\n    origin: {kind: canonical}\n    refs: [hastings2021dynamically]\n  - rung: R2\n    type: instantaneous-toric\n    description: >-\n      Contract every edge measured in the latest round into an effective\n      qubit. The resulting instantaneous stabilizer group is locally\n      Clifford-equivalent to a toric code, which explains the two logical\n      qubits without identifying the full spacetime protocol with a static\n      toric memory.\n    origin: {kind: curated, ref: hastings2021dynamically}\n    refs: [hastings2021dynamically]\n  - rung: R3\n    type: spacetime-detector\n    description: >-\n      Plaquette information is assembled from measurement outcomes at\n      different times. Faults are classified by the detector events they\n      create and by whether an undetectable spacetime history is benign, so\n      circuit fault distance cannot be read from one instantaneous snapshot.\n    origin: {kind: curated, ref: blackwell2025distance}\n    refs: [gidney2021fault, blackwell2025distance]\n  - rung: R5\n    type: fermionic\n    dialect: parton\n    description: >-\n      Kitaev's four-Majorana representation factors each directional Pauli\n      edge into a Z2 gauge variable and a matter-fermion pairing. The\n      measurement cycle then becomes a rotating pairing pattern whose\n      gauge-invariant products are the plaquette fluxes.\n    origin: {kind: curated, ref: kitaev2006anyons}\n    refs: [kitaev2006anyons, zhu2023majoranaliquid]\n    gap: {target: wanted:fermionic-compiler}\n  - rung: R5\n    type: anyon-automorphism\n    description: >-\n      One full code period transports the instantaneous toric order through a\n      protected cycle and exchanges electric and magnetic anyon labels. This\n      separates preservation of a logical subspace from the nontrivial logical\n      frame motion performed by the memory schedule itself.\n    origin: {kind: curated, ref: aasen2022automorphism}\n    refs: [hastings2021dynamically, aasen2022automorphism]\n  - rung: R5\n    type: measurement-qca\n    description: >-\n      Treating the periodic measurements as a measurement quantum cellular\n      automaton exposes information flow along boundaries and anomalies that\n      are invisible in the bulk stabilizer rank.\n    origin: {kind: curated, ref: aasen2023mqca}\n    refs: [aasen2023mqca]\n  - rung: R5\n    type: zx-spacetime\n    description: >-\n      A ZX diagram represents the whole measurement history as a spacetime\n      tensor network. Different circuit, fusion, and Floquet descriptions can\n      be related by local rewrites without pretending that their hardware\n      noise models are identical.\n    origin: {kind: curated, ref: bombin2024zx}\n    refs: [bombin2024zx]\ncategories:\n  - {id: dynamical, origin: {kind: curated, ref: hastings2021dynamically}}\n  - {id: non-css, origin: {kind: verified}}\n  - {id: topological, origin: {kind: curated, ref: hastings2021dynamically}}\nrefs:\n  - kitaev2006anyons\n  - hastings2021dynamically\n  - gidney2021fault\n  - aasen2022automorphism\n  - blackwell2025distance\n  - vuillot2021planar\n  - haah2022boundaries\n  - davydova2023css\n  - ellison2023twist\n  - fahimniya2025hyperbolic\n  - mclauchlan2024defects\n  - setiawan2025x3z3\n  - claes2025dynamic\n  - gidney2022planar\n  - paetznick2023majorana\n  - tobias2026worm\n  - sullivan2023twistnetworks\n  - kobayashi2024crosscap\n  - bauer2025nonclifford\n  - wootton2022plaquettes\n  - karzig2017majorana\n  - dessertaine2026photonic\n  - aasen2023mqca\n  - bombin2024zx\n  - zhu2023majoranaliquid\nparams: {L1: \"torus rows (L1 % 3 == 0: plaquette 3-colorability)\", L2: \"torus columns (L2 % 3 == 0: plaquette 3-colorability)\"}\nconstruction:\n  schema: qec-atlas-construction-v1\n  op: {id: plaquette_colored_floquet, version: 1}\n  inputs:\n    schedule:\n      ref: {kind: generator, id: honeycomb_torus_schedule, version: 1}\n      params:\n        L1: {instance_param: L1}\n        L2: {instance_param: L2}\n      output: schedule\n  output: checkmatrix\n  match: exact-checkmatrix-v1\ntier: T3\nfit:\n  platforms:\n    [majorana-parity-measurement, superconducting-dynamic-circuit, spin-photonic]\n  tasks: [memory, measurement-driven-logical-operations]\ndecoders:\n  - id: mwpm\n    status: standard\n    noise: \"periodic honeycomb detector graphs with repeated parity-measurement faults\"\n    notes: >-\n      Plaquette changes populate two interleaved spacetime matching graphs.\n      Correlation-aware matching uses the named parity-measurement circuit and\n      its edge probabilities; the reported threshold range therefore belongs\n      to that circuit/noise/decoder triple, not to the abstract schedule.\n    refs: [gidney2021fault]\n  - id: mwpm\n    status: research-grade\n    noise: \"planar SD6, SI1000, EM3, and Majorana-native detector models\"\n    notes: >-\n      Boundaries, hook propagation, correlated parity faults, and measurement\n      normalization change the detector graph. Planar and Majorana benchmarks\n      must be compared within their stated circuit models rather than\n      transferred to the torus snapshot.\n    refs: [gidney2022planar, paetznick2023majorana]\nrealizations:\n  - platform: \"IBM Falcon superconducting processor\"\n    status: demonstrated\n    description: >-\n      A preliminary hardware study measured plaquette stabilizers of the\n      original Floquet schedule and reported syndrome-change rates. It did not\n      demonstrate a protected logical memory, distance scaling, or logical\n      error suppression.\n    refs: [wootton2022plaquettes]\n  - platform: \"Majorana-tetron parity-measurement architecture\"\n    status: proposed\n    description: >-\n      Native pair-parity measurements and planar layouts were simulated with\n      Majorana-specific faults. This is an architecture and decoder study, not\n      a laboratory realization of a logical honeycomb memory.\n    refs: [karzig2017majorana, paetznick2023majorana]\n  - platform: \"spin-optical photonic architecture\"\n    status: proposed\n    description: >-\n      A co-designed photonic implementation was benchmarked numerically under\n      its loss and hardware assumptions. Its simulated loss threshold is not\n      an experimental honeycomb threshold.\n    refs: [dessertaine2026photonic]\n  - platform: \"ancilla-free dynamic superconducting circuit\"\n    status: proposed\n    description: >-\n      Data and measurement roles change during the cycle to remove dedicated\n      ancillas, clear leakage, and improve timelike distance. The result is a\n      simulated circuit proposal with a different detector model.\n    refs: [claes2025dynamic]\nrelations:\n  - type: same_bulk_phase_as\n    target: toric\n    how: >-\n      After each round, contracting the just-measured matching and applying a\n      depth-one local Clifford change of basis maps the instantaneous\n      stabilizer group to toric-code stabilizers on a coarser lattice. The\n      equivalence is frame-by-frame; the full protocol still has spacetime\n      detectors and a nontrivial anyon automorphism.\n    refs: [hastings2021dynamically, aasen2022automorphism]\noperations:\n  - gate: \"electric-magnetic anyon exchange / logical-frame automorphism\"\n    mechanism: measurement-based\n    level: \"topological Clifford frame\"\n    cost: \"one three-round memory period; two periods close the anyon label frame\"\n    origin: {kind: claimed, ref: hastings2021dynamically}\n  - gate: \"twist creation, transport, fusion, and braiding\"\n    mechanism: braiding\n    level: \"defect-mediated topological operations\"\n    cost: >-\n      schedule deformations along condensation lines plus repeated\n      fault-tolerant measurements around moving twist endpoints\n    origin: {kind: claimed, ref: ellison2023twist}\n  - gate: \"logical HZ on a cross-cap encoded qubit\"\n    mechanism: measurement-based\n    level: \"Clifford\"\n    cost: >-\n      one schedule period on a non-orientable cross-cap geometry, or a folded\n      bilayer implementation of that geometry\n    origin: {kind: claimed, ref: kobayashi2024crosscap}\n",
    "version": "qec-atlas-card-v1"
  },
