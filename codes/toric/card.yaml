    "entry_id": "toric",
    "path": "atlas/toric/card.yaml",
    "sha256": "304601d2a3226a970a5dfa8084cfb66a2e7cb7bc2e4e31b4a8ee4302c673ff0f",
    "text": "id: toric\nkind: family\nidentity:\n  canonical_name: \"Toric code\"\n  variant: \"two-dimensional periodic square cellulation\"\n  aliases: [\"Kitaev toric code\", \"surface code on a torus\", \"square-lattice toric code\"]\npresentation:\n  orienting_view: {status: available, kind: lattice}\n  guided_tour: {status: available}\neczoo:\n  status: mapped\n  zoo_id: toric\n  classification: exact-family\n  source:\n    repository_url: https://github.com/errorcorrectionzoo/eczoo_data\n    commit: b2437d9e2dc09284e04c66ef72ee81b7ed7bd129\n    retrieved_on: \"2026-08-05\"\n    path: codes/quantum/qubits/stabilizer/topological/surface/2d_surface/toric/toric.yml\n    sha256: e5cf8abbdc9733e971853999ed73d0be6253410613a66f24a0af95e19946a2ed\n    page_url: https://errorcorrectionzoo.org/c/toric\n    blob_url: https://github.com/errorcorrectionzoo/eczoo_data/blob/b2437d9e2dc09284e04c66ef72ee81b7ed7bd129/codes/quantum/qubits/stabilizer/topological/surface/2d_surface/toric/toric.yml\ndescription: >-\n  The square Toric code puts one qubit on every edge of an L-by-L periodic\n  square cellulation. Vertex X stars and face Z plaquettes detect endpoints of\n  open error strings. Contractible closed strings are stabilizers, while the\n  two independent primal cycles and their crossing dual cycles form two\n  logical Pauli pairs. This entry is the static two-dimensional qubit family,\n  not an open Surface patch, a higher-dimensional Toric code, or every model\n  in the same topological phase.\nviews:\n  - rung: R1\n    type: symplectic-css-checks\n    description: >-\n      Expanding every vertex star and face boundary gives sparse binary X and\n      Z matrices. Their stacked symplectic rows are the executable baseline\n      for commutation, rank, exact small-instance distance, logical-loop, and\n      stacked-block CNOT checks.\n    origin:\n      kind: derived\n      converter: \"ChainComplex.to_checkmatrix plus toric logical-support validation\"\n      version: \"toric-square-v2\"\n    refs: [kitaev1997imperfect, kitaev2003fault]\n  - rung: R2\n    type: periodic-chain-complex\n    description: >-\n      Qubits are the one-cells of a square cellulation of the torus. The face\n      boundary d2 and vertex incidence d1 satisfy d1 d2=0; HX=d1 and HZ=d2^T.\n      Cycles modulo local boundaries leave the two noncontractible homology\n      directions and hence two logical qubits.\n    origin: {kind: canonical}\n    refs: [kitaev1997quantum, kitaev2003fault, dennis2002topological]\n  - rung: R2\n    type: cyclic-hypergraph-product\n    description: >-\n      Let C_L be the square cyclic repetition parity map with one check per\n      periodic neighbor pair. HGP(C_L, C_L^T) reproduces the constructor's\n      ordered star and plaquette matrices exactly. The square cyclic factors\n      have both kernel and transpose-kernel sectors; this is why the output\n      has two logical sectors, unlike HGP of the open repetition factors used\n      by the planar Surface entry.\n    origin:\n      kind: derived\n      converter: \"pedagogy/reproduce.py cyclic_hgp_checkmatrix\"\n      version: \"cyclic-hgp-exact-v1\"\n    refs: [tillich2009quantum, kovalev2012improved]\n  - rung: R5\n    type: anyon-strings\n    description: >-\n      Open primal and dual strings create endpoint excitations of the two\n      charge types. Closed contractible strings act locally, while crossing\n      noncontractible strings have odd symplectic intersection and therefore\n      realize conjugate logical Paulis.\n    origin: {kind: curated, ref: kitaev2003fault}\n    refs: [kitaev2003fault]\n  - rung: R5\n    type: statistical-mechanics\n    description: >-\n      Corrections with one syndrome split into homology classes whose total\n      likelihoods become disorder-sector partition functions. Matching keeps\n      a light representative; maximum-likelihood decoding compares class free\n      energies. The phase boundary depends on the noise and syndrome model.\n    origin: {kind: curated, ref: dennis2002topological}\n    refs: [dennis2002topological, wang2003confinement, chubb2021statistical]\n  - rung: R5\n    type: tensor-network\n    description: >-\n      A PEPS virtual Z2 symmetry encodes the same topological degeneracy and\n      local indistinguishability. In decoding, tensor contractions instead sum\n      probabilities inside logical classes; the state representation and the\n      decoder use related mathematics but answer different questions.\n    origin: {kind: curated, ref: schuch2010peps}\n    refs: [schuch2010peps, bravyi2014efficient]\n  - rung: R5\n    type: fermionic\n    dialect: majorana-pairs\n    description: >-\n      Under restricted coherent-noise channels the correction calculation can\n      be mapped to free Majorana fermions and simulated efficiently. This is a\n      channel-specific algorithmic dictionary, not a claim that the physical\n      qubits are tetrons or that arbitrary coherent noise becomes Pauli noise.\n    origin: {kind: curated, ref: bravyi2018coherent}\n    refs: [bravyi2018coherent, iverson2020coherence]\n    gap: {target: wanted:fermionic-compiler}\ncategories:\n  - {id: css, origin: {kind: verified}}\n  - {id: topological, origin: {kind: curated, ref: kitaev2003fault}}\n  - {id: hypergraph-product, origin: {kind: curated, ref: tillich2009quantum}}\nrefs:\n  - kitaev1997imperfect\n  - kitaev1997quantum\n  - kitaev2003fault\n  - dennis2002topological\n  - bravyi1998quantum\n  - tillich2009quantum\n  - kovalev2012improved\n  - wang2003confinement\n  - wang2010thresholds\n  - stace2009loss\n  - duclos2010fast\n  - bravyi2014efficient\n  - breuckmann2017local\n  - bravyi2018coherent\n  - chubb2021statistical\n  - iverson2020coherence\n  - roffe2020decoding\n  - higgott2022pymatching\n  - schuch2010peps\n  - bravyi2013classification\n  - guernut2024toric\n  - bauer2025nonclifford\n  - hastings2021dynamically\n  - aasen2022automorphism\n  - bluvstein2022processor\n  - atomcomputing2026toric\nparams:\n  L: >-\n    Integer linear size L >= 2 of the periodic square fundamental domain;\n    there are L^2 vertices, L^2 faces, and 2 L^2 edge qubits.\nvisual_instance: L3\ntier: T2\nfit:\n  platforms: [neutral-atom-reconfigurable, periodic-lattice-simulator]\n  tasks: [memory, topological-state-preparation, decoder-benchmarking]\ndecoders:\n  - id: mwpm\n    status: standard\n    noise: \"independent X/Z data faults with perfect syndrome (code capacity)\"\n    notes: >-\n      Defects are paired on the periodic primal or dual lattice. The decoder\n      minimizes one additive chain cost; it does not sum every degenerate path\n      in a logical class, and its benchmark cannot be transferred to\n      depolarizing, coherent, or faulty-syndrome models.\n    refs: [dennis2002topological, wang2010thresholds, higgott2022pymatching]\n  - id: mwpm\n    status: standard\n    noise: \"repeated noisy data and syndrome records in a declared phenomenological or circuit detector model\"\n    notes: >-\n      Matching moves to spacetime. Round boundaries, measurement normalization,\n      hook correlations, and the extraction schedule become part of the\n      decoder identity, so no code-capacity number is reused here.\n    refs: [dennis2002topological, wang2003confinement, wang2010thresholds]\n  - id: renormalization-group\n    status: standard\n    noise: \"periodic topological-code Pauli models with a specified syndrome history\"\n    notes: >-\n      Hierarchical coarse-graining retains approximate logical-class\n      probabilities and trades accuracy for speed. Published behavior belongs\n      to the chosen lattice, channel, scale rule, and syndrome model.\n    refs: [duclos2010fast]\n  - id: tensor-network-mld\n    status: standard\n    noise: \"restricted independent channels exactly, and locally correlated Pauli channels approximately\"\n    notes: >-\n      Free-fermion or tensor contractions compare logical-class weights rather\n      than selecting one light path. Exactness and runtime change with the\n      channel and contraction width; they are not universal Toric properties.\n    refs: [bravyi2014efficient, chubb2021statistical]\n  - id: bp-osd\n    status: research-grade\n    noise: \"finite sparse CSS matrices with calibrated soft information and perfect syndrome\"\n    notes: >-\n      BP-OSD is a portable qLDPC baseline. Ordered-statistics post-processing\n      can repair short-cycle message-passing failures, but no Toric-specific\n      likelihood or threshold follows from the matrix alone.\n    refs: [roffe2020decoding]\n  - id: mwpm\n    status: research-grade\n    noise: \"detectable qubit loss with known erasure locations plus declared computational faults\"\n    notes: >-\n      Lost edges can be merged into superchecks and decoded using their known\n      locations. The percolation boundary and the computational-error tradeoff\n      are specific to detectable loss, not to unheralded leakage.\n    refs: [stace2009loss]\nrealizations:\n  - platform: \"reconfigurable neutral-atom array with coherent transport\"\n    status: demonstrated\n    description: >-\n      The experiment prepared and characterized a finite Toric-code state on\n      periodic geometry. This establishes state preparation, not repeated\n      syndrome extraction, arbitrary logical-state preservation, or\n      below-threshold scaling.\n    refs: [bluvstein2022processor]\n  - platform: \"neutral-atom array with mid-circuit measurement and atom reloading\"\n    status: demonstrated\n    description: >-\n      Repeated Toric syndrome extraction, lost-qubit replacement, reservoir\n      reloading, and decoded logical-memory data were demonstrated. The\n      reported finite two-distance comparison remains bound to its stated\n      round range and is not promoted as an asymptotic threshold.\n    refs: [atomcomputing2026toric]\nrelations:\n  - type: product_of\n    target: hgp\n    how: >-\n      HGP(C_L, C_L^T), where C_L is the square cyclic neighbor-parity map,\n      reproduces the ordered Toric check matrices exactly. These periodic\n      square factors are not the open rep_L factors used by the planar Surface\n      construction recipe.\n    refs: [tillich2009quantum, kovalev2012improved]\n  - type: same_bulk_phase_as\n    target: surface\n    how: >-\n      Both use the square-lattice star and plaquette bulk. Cutting the torus\n      creates rough and smooth boundaries and changes absolute cycles into\n      relative strings; closing those boundaries restores two periodic\n      homology directions. Bulk equivalence is not code-space identity.\n    refs: [kitaev2003fault, bravyi1998quantum, dennis2002topological]\n  - type: same_bulk_phase_as\n    target: honeycomb\n    how: >-\n      At the appropriate frames, contracting the just-measured Honeycomb\n      matching and applying a depth-one local Clifford basis change gives\n      Toric stabilizers on a coarser lattice. The full Honeycomb object remains\n      a time-periodic measurement protocol with spacetime detectors and an\n      anyon automorphism.\n    refs: [hastings2021dynamically, aasen2022automorphism]\noperations:\n  - gate: \"logical X / Z Pauli loops\"\n    mechanism: transversal\n    level: \"Pauli\"\n    cost: \"one parallel physical-Pauli layer on a noncontractible length-L support, or a classical Pauli-frame update\"\n    origin: {kind: verified, method: \"constructor logical-loop commutation, row-space, and symplectic-pair checks\"}\n  - gate: \"CNOT between corresponding logical sectors of two aligned Toric blocks\"\n    mechanism: transversal\n    level: \"Clifford\"\n    cost: \"one pairwise physical-CNOT layer; alignment, transport, and correlated decoding are external architecture costs\"\n    origin: {kind: verified, method: \"pedagogy/reproduce.py stacked-block symplectic conjugation\"}\n  - gate: \"single-block Clifford generating set\"\n    mechanism: fold-transversal\n    level: \"Clifford\"\n    cost: \"fold pairings, Dehn-twist deformation, and single-shot logical Pauli measurements with protocol-specific ancillas and decoding\"\n    origin: {kind: claimed, ref: guernut2024toric}\n  - gate: \"logical Pauli measurement\"\n    mechanism: measurement-based\n    level: \"stabilizer measurement\"\n    cost: \"single-shot measurement gadget plus an ancilla layout and decoder from the proposed Toric Clifford protocol\"\n    origin: {kind: claimed, ref: guernut2024toric}\n",
    "version": "qec-atlas-card-v1"
