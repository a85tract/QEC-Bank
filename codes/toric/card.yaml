        "rung": "R1",
        "type": "symplectic-css-checks"
      },
      {
        "description": "Qubits are the one-cells of a square cellulation of the torus. The face boundary d2 and vertex incidence d1 satisfy d1 d2=0; HX=d1 and HZ=d2^T. Cycles modulo local boundaries leave the two noncontractible homology directions and hence two logical qubits.",
        "origin": {
          "kind": "canonical"
        },
        "refs": [
          "kitaev1997quantum",
          "kitaev2003fault",
          "dennis2002topological"
        ],
        "rung": "R2",
        "type": "periodic-chain-complex"
      },
      {
        "description": "Let C_L be the square cyclic repetition parity map with one check per periodic neighbor pair. HGP(C_L, C_L^T) reproduces the constructor's ordered star and plaquette matrices exactly. The square cyclic factors have both kernel and transpose-kernel sectors; this is why the output has two logical sectors, unlike HGP of the open repetition factors used by the planar Surface entry.",
        "origin": {
          "converter": "pedagogy/reproduce.py cyclic_hgp_checkmatrix",
          "kind": "derived",
          "version": "cyclic-hgp-exact-v1"
        },
        "refs": [
          "tillich2009quantum",
          "kovalev2012improved"
        ],
        "rung": "R2",
        "type": "cyclic-hypergraph-product"
      },
      {
        "description": "Open primal and dual strings create endpoint excitations of the two charge types. Closed contractible strings act locally, while crossing noncontractible strings have odd symplectic intersection and therefore realize conjugate logical Paulis.",
        "origin": {
          "kind": "curated",
          "ref": "kitaev2003fault"
        },
        "refs": [
          "kitaev2003fault"
        ],
        "rung": "R5",
        "type": "anyon-strings"
      },
      {
        "description": "Corrections with one syndrome split into homology classes whose total likelihoods become disorder-sector partition functions. Matching keeps a light representative; maximum-likelihood decoding compares class free energies. The phase boundary depends on the noise and syndrome model.",
        "origin": {
          "kind": "curated",
          "ref": "dennis2002topological"
        },
        "refs": [
