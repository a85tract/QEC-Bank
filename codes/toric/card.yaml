    "views": [
      {
        "description": "Expanding every vertex star and face boundary gives sparse binary X and Z matrices. Their stacked symplectic rows are the executable baseline for commutation, rank, exact small-instance distance, logical-loop, and stacked-block CNOT checks.",
        "origin": {
          "converter": "ChainComplex.to_checkmatrix plus toric logical-support validation",
          "kind": "derived",
