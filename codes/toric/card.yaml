          "wang2003confinement",
          "chubb2021statistical"
        ],
        "rung": "R5",
        "type": "statistical-mechanics"
      },
      {
        "description": "A PEPS virtual Z2 symmetry encodes the same topological degeneracy and local indistinguishability. In decoding, tensor contractions instead sum probabilities inside logical classes; the state representation and the decoder use related mathematics but answer different questions.",
