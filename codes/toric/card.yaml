    "relations": [
      {
        "how": "HGP(C_L, C_L^T), where C_L is the square cyclic neighbor-parity map, reproduces the ordered Toric check matrices exactly. These periodic square factors are not the open rep_L factors used by the planar Surface construction recipe.",
        "refs": [
          "tillich2009quantum",
          "kovalev2012improved"
        ],
        "target": "hgp",
        "type": "product_of"
      },
      {
        "how": "Both use the square-lattice star and plaquette bulk. Cutting the torus creates rough and smooth boundaries and changes absolute cycles into relative strings; closing those boundaries restores two periodic homology directions. Bulk equivalence is not code-space identity.",
        "refs": [
          "kitaev2003fault",
          "bravyi1998quantum",
          "dennis2002topological"
        ],
        "target": "surface",
        "type": "same_bulk_phase_as"
      },
      {
        "how": "At the appropriate frames, contracting the just-measured Honeycomb matching and applying a depth-one local Clifford basis change gives Toric stabilizers on a coarser lattice. The full Honeycomb object remains a time-periodic measurement protocol with spacetime detectors and an anyon automorphism.",
        "refs": [
          "hastings2021dynamically",
          "aasen2022automorphism"
        ],
        "target": "honeycomb",
        "type": "same_bulk_phase_as"
      }
