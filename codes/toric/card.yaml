    {
      "applies_to": {
        "id": "eczoo-entity:toric#collection",
        "kind": "entity"
      },
      "content": {
        "description": "Qubits are the one-cells of a square cellulation of the torus. The face boundary d2 and vertex incidence d1 satisfy d1 d2=0; HX=d1 and HZ=d2^T. Cycles modulo local boundaries leave the two noncontractible homology directions and hence two logical qubits.",
        "origin": {
          "kind": "canonical"
        },
        "refs": [
          "kitaev1997quantum",
          "kitaev2003fault",
          "dennis2002topological"
        ],
        "rung": "R2",
        "type": "periodic-chain-complex"
      },
