    "description": "The square Toric code puts one qubit on every edge of an L-by-L periodic square cellulation. Vertex X stars and face Z plaquettes detect endpoints of open error strings. Contractible closed strings are stabilizers, while the two independent primal cycles and their crossing dual cycles form two logical Pauli pairs. This entry is the static two-dimensional qubit family, not an open Surface patch, a higher-dimensional Toric code, or every model in the same topological phase.",
