      },
      "content": {
        "description": "Bounded check weight does not imply bounded-depth nearest-neighbor extraction in a low-dimensional layout. Expansion distributes Tanner neighbors non-geometrically, so a device needs long-range couplers, routing, or growing local depth. Theoretical constant-overhead recovery accounts for a full architecture; it is not an experimental realization of the finite blocks exported here.",
