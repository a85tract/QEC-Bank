    {
      "applies_to": {
        "id": "atlas-formalization:quantum_expander",
        "kind": "formalization"
      },
      "content": {
        "description": "Apply HGP(H,H). Physical qubits split into A-by-A and B-by-B sectors, while X checks occupy B-by-A and Z checks occupy A-by-B. Each CSS row combines one factor incidence with its transpose partner. The two mixed Kronecker terms therefore appear twice in HX HZ^T and cancel over GF(2).",
        "origin": {
          "kind": "canonical"
        },
        "refs": [
          "tillich2009quantum",
          "leverrier2015quantumexpander"
        ],
        "rung": "R2",
        "type": "symmetric-hypergraph-product"
      },
      "evidence_id": "atlas-evidence:quantum_expander:views:2@937a6d04656a77da8479cafa370df6290c2998da826300b8a807ad5d23cebf3c",
      "field": "views",
