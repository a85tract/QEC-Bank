    "relations": [
      {
        "how": "The family fixes the symmetric HGP specialization HGP(H,H) and then restricts H to biregular Tanner factors satisfying two-sided small-set expansion. The constructor regression compares every exported CSS row literally with qeclib.constructions.hgp; generic HGP codes need not meet the expansion hypotheses and are not aliases of this family.",
        "refs": [
          "tillich2009quantum",
          "leverrier2015quantumexpander"
        ],
        "target": "hgp",
        "type": "product_of"
      }
    ],
    "tier": "T2",
    "views": [
      {
        "description": "Applying the symmetric hypergraph product expands the finite factor into sparse binary X- and Z-check matrices. Their stacked symplectic rows are the executable baseline for commutation, rank, logical witnesses, and finite-distance checks.",
        "origin": {
          "converter": "quantum_expander.build -> CheckMatrix.from_css",
          "kind": "derived",
          "version": "v1"
        },
        "refs": [
          "tillich2009quantum",
          "leverrier2015quantumexpander"
        ],
        "rung": "R1",
        "type": "symplectic-css-checks"
      },
      {
        "description": "Write the classical parity matrix H as a biregular bipartite graph with variable side A and check side B. For every nonempty S within the chosen cutoff, compare its distinct neighborhood with Delta times |S|. The decoder theorem needs this inequality independently on A and B with both deficit parameters strictly below one sixth; a spectral-gap label or expansion of the later quantum Tanner graph is not a substitute.",
        "origin": {
          "kind": "curated",
          "ref": "leverrier2015quantumexpander"
        },
        "refs": [
          "leverrier2015quantumexpander",
          "hoory2006expander"
        ],
        "rung": "R2",
        "type": "two-sided-tanner-expansion"
      },
      {
        "description": "Apply HGP(H,H). Physical qubits split into A-by-A and B-by-B sectors, while X checks occupy B-by-A and Z checks occupy A-by-B. Each CSS row combines one factor incidence with its transpose partner. The two mixed Kronecker terms therefore appear twice in HX HZ^T and cancel over GF(2).",
        "origin": {
          "kind": "canonical"
        },
        "refs": [
          "tillich2009quantum",
          "leverrier2015quantumexpander"
        ],
        "rung": "R2",
        "type": "symmetric-hypergraph-product"
      },
      {
        "description": "Given a perfect stabilizer syndrome, inspect subsets contained inside one bounded stabilizer support and apply a subset whose flip decreases syndrome weight enough. Expansion ensures that a sufficiently small adversarial error exposes a useful move and that zero syndrome below the protected scale cannot conceal a logical class. This is a generator- local greedy decoder, not bitwise majority voting.",
        "origin": {
          "kind": "curated",
          "ref": "leverrier2015quantumexpander"
        },
        "refs": [
          "leverrier2015quantumexpander"
        ],
        "rung": "R5",
        "type": "small-set-flip"
      },
      {
        "description": "The founding small-set-flip theorem treats bounded-weight adversarial Pauli errors with perfect syndrome. The later random-error analysis uses probability to exclude bad local structures, and peeling follows resolvable erasure structure. These are three statements with different inputs and failure events; none licenses one model-free threshold.",
        "origin": {
          "kind": "curated",
          "ref": "fawzi2017efficient"
        },
        "refs": [
          "leverrier2015quantumexpander",
          "fawzi2017efficient",
          "prabhu2025peeling"
        ],
        "rung": "R5",
        "type": "decoder-regime-split"
      },
      {
        "description": "A kernel word of H can be lifted into one HGP product sector to give a quantum logical witness. The HGP distance theorem combines the classical distance of H with the transpose distance of H^T. The finite constructor exhausts both small kernels and exports one lifted logical, but scalable lower-bound certification remains a separate problem.",
        "origin": {
