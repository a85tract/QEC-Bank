        "description": "A theoretical constant-overhead scheme combines quantum-expander recovery with encoded ancillas and fault-tolerant scheduling. Geometric measurement bounds show why sparse checks alone do not supply a shallow two-dimensional local circuit. No repeated-syndrome laboratory realization of the exact family was found as of 2026-08-09.",
