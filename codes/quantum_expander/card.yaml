    {
      "applies_to": {
        "id": "eczoo-entity:quantum_expander#collection",
        "kind": "entity"
      },
      "content": {
        "description": "Given a perfect stabilizer syndrome, inspect subsets contained inside one bounded stabilizer support and apply a subset whose flip decreases syndrome weight enough. Expansion ensures that a sufficiently small adversarial error exposes a useful move and that zero syndrome below the protected scale cannot conceal a logical class. This is a generator- local greedy decoder, not bitwise majority voting.",
        "origin": {
          "kind": "curated",
          "ref": "leverrier2015quantumexpander"
        },
        "refs": [
          "leverrier2015quantumexpander"
        ],
        "rung": "R5",
        "type": "small-set-flip"
      },
