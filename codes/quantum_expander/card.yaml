  "source": {
    "collection": "atlas",
    "encoding": "utf-8",
    "entry_id": "quantum_expander",
    "path": "atlas/quantum_expander/card.yaml",
    "sha256": "92bd6bbd9b69e69897994456229220e3398d6ff09389732f856b5cc1ae0dc8fe",
    "text": "id: quantum_expander\nkind: family\nidentity:\n  canonical_name: \"Quantum expander code\"\n  variant: \"binary symmetric hypergraph-product family\"\n  aliases:\n    - \"quantum expander codes\"\n    - \"small-set-flip quantum codes\"\npresentation:\n  orienting_view: {status: available, kind: construction}\n  guided_tour: {status: available}\neczoo:\n  status: mapped\n  zoo_id: quantum_expander\n  classification: exact-family\n  source:\n    repository_url: https://github.com/errorcorrectionzoo/eczoo_data\n    commit: b2437d9e2dc09284e04c66ef72ee81b7ed7bd129\n    retrieved_on: \"2026-08-05\"\n    path: codes/quantum/qubits/stabilizer/qldpc/balanced_product/tensor/singlesector/hypergraph/quantum_expander.yml\n    sha256: 8c56c46764375f2cab77f7596837f071340af40363f6c3f617a40e6df1e9270c\n    page_url: https://errorcorrectionzoo.org/c/quantum_expander\n    blob_url: https://github.com/errorcorrectionzoo/eczoo_data/blob/b2437d9e2dc09284e04c66ef72ee81b7ed7bd129/codes/quantum/qubits/stabilizer/qldpc/balanced_product/tensor/singlesector/hypergraph/quantum_expander.yml\ndescription: >-\n  A quantum expander code is a hypergraph-product CSS code whose sparse\n  classical Tanner factor expands every sufficiently small vertex set on both\n  sides. Expansion belongs to the classical factor, not to the quantum check\n  graph, and it is the hypothesis that makes the local small-set-flip decoder\n  provable. The constructor exports two deterministic finite factors and\n  exhaustively checks their declared cutoffs. Those witnesses teach the\n  predicate and verify finite HGP blocks; they are not an explicit asymptotic\n  family with fixed degrees and fixed expansion constants, which the founding\n  source reports only through probabilistic existence.\nclaim_gaps:\n  - {property: d, target: wanted:fast-distance}\nviews:\n  - rung: R1\n    type: symplectic-css-checks\n    description: >-\n      Applying the symmetric hypergraph product expands the finite factor into\n      sparse binary X- and Z-check matrices. Their stacked symplectic rows are\n      the executable baseline for commutation, rank, logical witnesses, and\n      finite-distance checks.\n    origin:\n      kind: derived\n      converter: \"quantum_expander.build -> CheckMatrix.from_css\"\n      version: \"v1\"\n    refs: [tillich2009quantum, leverrier2015quantumexpander]\n  - rung: R2\n    type: two-sided-tanner-expansion\n    description: >-\n      Write the classical parity matrix H as a biregular bipartite graph with\n      variable side A and check side B. For every nonempty S within the chosen\n      cutoff, compare its distinct neighborhood with Delta times |S|. The\n      decoder theorem needs this inequality independently on A and B with\n      both deficit parameters strictly below one sixth; a spectral-gap label\n      or expansion of the later quantum Tanner graph is not a substitute.\n    origin: {kind: curated, ref: leverrier2015quantumexpander}\n    refs: [leverrier2015quantumexpander, hoory2006expander]\n  - rung: R2\n    type: symmetric-hypergraph-product\n    description: >-\n      Apply HGP(H,H). Physical qubits split into A-by-A and B-by-B sectors,\n      while X checks occupy B-by-A and Z checks occupy A-by-B. Each CSS row\n      combines one factor incidence with its transpose partner. The two mixed\n      Kronecker terms therefore appear twice in HX HZ^T and cancel over GF(2).\n    origin: {kind: canonical}\n    refs: [tillich2009quantum, leverrier2015quantumexpander]\n  - rung: R5\n    type: small-set-flip\n    description: >-\n      Given a perfect stabilizer syndrome, inspect subsets contained inside\n      one bounded stabilizer support and apply a subset whose flip decreases\n      syndrome weight enough. Expansion ensures that a sufficiently small\n      adversarial error exposes a useful move and that zero syndrome below the\n      protected scale cannot conceal a logical class. This is a generator-\n      local greedy decoder, not bitwise majority voting.\n    origin: {kind: curated, ref: leverrier2015quantumexpander}\n    refs: [leverrier2015quantumexpander]\n  - rung: R5\n    type: decoder-regime-split\n    description: >-\n      The founding small-set-flip theorem treats bounded-weight adversarial\n      Pauli errors with perfect syndrome. The later random-error analysis uses\n      probability to exclude bad local structures, and peeling follows\n      resolvable erasure structure. These are three statements with different\n      inputs and failure events; none licenses one model-free threshold.\n    origin: {kind: curated, ref: fawzi2017efficient}\n    refs: [leverrier2015quantumexpander, fawzi2017efficient, prabhu2025peeling]\n  - rung: R2\n    type: factor-distance-lift\n    description: >-\n      A kernel word of H can be lifted into one HGP product sector to give a\n      quantum logical witness. The HGP distance theorem combines the classical\n      distance of H with the transpose distance of H^T. The finite constructor\n      exhausts both small kernels and exports one lifted logical, but scalable\n      lower-bound certification remains a separate problem.\n    origin:\n      kind: derived\n      converter: \"constructor._minimum_kernel_word + factor-derived X logical\"\n      version: \"v1\"\n    refs: [tillich2009quantum]\n  - rung: R4\n    type: nongeometric-syndrome-circuits\n    description: >-\n      Bounded check weight does not imply bounded-depth nearest-neighbor\n      extraction in a low-dimensional layout. Expansion distributes Tanner\n      neighbors non-geometrically, so a device needs long-range couplers,\n      routing, or growing local depth. Theoretical constant-overhead recovery\n      accounts for a full architecture; it is not an experimental realization\n      of the finite blocks exported here.\n    origin: {kind: curated, ref: delfosse2021measurement}\n    refs: [delfosse2021measurement, fawzi2018constant]\ncategories:\n  - {id: css, origin: {kind: verified}}\n  - {id: hypergraph-product, origin: {kind: curated, ref: tillich2009quantum}}\n  - {id: qldpc, origin: {kind: curated, ref: leverrier2015quantumexpander}}\nrefs:\n  - leverrier2015quantumexpander\n  - tillich2009quantum\n  - hoory2006expander\n  - fawzi2017efficient\n  - prabhu2025peeling\n  - fawzi2018constant\n  - gottesman2013constant\n  - golowich2025addressable\n  - delfosse2021measurement\n  - placke2024spin\n  - panteleev2021degenerate\nparams:\n  factor: >-\n    Named deterministic finite Tanner witness. Supported values are\n    complete-graph-5-incidence and affine-plane-4-incidence. The value selects\n    fixed ordered incidence data and finite expansion cutoffs, not a scalable\n    asymptotic expander generator.\nvisual_instance: complete_graph_5\ntier: T2\nfit:\n  platforms:\n    - long-range-connected-quantum-register\n    - routed-qldpc-syndrome-architecture\n  tasks:\n    - constant-rate-quantum-memory-theory\n    - expansion-certified-decoder-research\n    - nongeometric-qldpc-fault-tolerance\ndecoders:\n  - id: css-pivot\n    status: research-grade\n    noise: >-\n      one exported finite CSS matrix with perfect X- and Z-syndrome bits; the\n      deterministic algebraic solution ignores error likelihood and degeneracy\n    notes: >-\n      This is only a reproducible matrix baseline. It is not small-set flip and\n      inherits none of the adversarial or random-error expansion guarantees.\n      The family-specific algorithm is explained in the small-set-flip view;\n      the current controlled decoder registry has no distinct benchmark adapter\n      for it.\n    refs: [leverrier2015quantumexpander]\n  - id: bp-osd\n    status: research-grade\n    noise: >-\n      code-capacity Pauli noise with perfect syndrome on a sparse binary HGP\n      check matrix\n    notes: >-\n      BP-OSD is a generic qLDPC comparison point. Its finite-length behavior,\n      tuning, and thresholds on other sparse families do not prove the\n      expansion-conditioned small-set-flip theorem for this family.\n    refs: [panteleev2021degenerate]\n  - id: none-known\n    status: none-known\n    gap: {target: wanted:qldpc-circuit-decoding}\n    noise: >-\n      a complete repeated syndrome-extraction circuit with data, measurement,\n      routing, leakage, and correlated hardware faults\n    notes: >-\n      No exact-family circuit-level threshold or repeated-syndrome experimental\n      decoder was found in the primary-source search completed on 2026-08-09.\n      This dated gap does not erase the perfect-syndrome small-set-flip theorem.\n    refs: [leverrier2015quantumexpander, delfosse2021measurement]\nrealizations:\n  - platform: \"non-geometrically-local qLDPC fault-tolerance architecture\"\n    status: proposed\n    description: >-\n      A theoretical constant-overhead scheme combines quantum-expander recovery\n      with encoded ancillas and fault-tolerant scheduling. Geometric measurement\n      bounds show why sparse checks alone do not supply a shallow two-dimensional\n      local circuit. No repeated-syndrome laboratory realization of the exact\n      family was found as of 2026-08-09.\n    refs: [fawzi2018constant, delfosse2021measurement]\nrelations:\n  - type: product_of\n    target: hgp\n    how: >-\n      The family fixes the symmetric HGP specialization HGP(H,H) and then\n      restricts H to biregular Tanner factors satisfying two-sided small-set\n      expansion. The constructor regression compares every exported CSS row\n      literally with qeclib.constructions.hgp; generic HGP codes need not meet\n      the expansion hypotheses and are not aliases of this family.\n    refs: [tillich2009quantum, leverrier2015quantumexpander]\noperations:\n  - gate: \"constant-overhead fault-tolerant encoded computation\"\n    mechanism: measurement-based\n    level: \"protocol-level fault tolerance\"\n    cost: >-\n      combine quantum-expander blocks with encoded ancillas, repeated recovery,\n      classical decoding, and the paper's scheduling assumptions; constant\n      overhead is an asymptotic property of the complete scheme, not a native\n      transversal gate of one HGP check matrix\n    origin: {kind: claimed, ref: fawzi2018constant}\n  - gate: \"addressable gates through single-shot code switching\"\n    mechanism: switching\n    level: \"addressable logical operation in a multi-code protocol\"\n    cost: >-\n      switch into the auxiliary code required by the protocol, perform the\n      addressed operation, recover through the single-shot boundary, and track\n      the logical frame; the base quantum-expander block alone is not thereby\n      an addressably universal transversal code\n    origin: {kind: claimed, ref: golowich2025addressable}\n",
    "version": "qec-atlas-card-v1"
  },
