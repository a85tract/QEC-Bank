        "type": "symplectic-css-checks"
      },
      {
        "description": "Two open length-L repetition chains form the two axes. The two HGP qubit blocks are bit×bit and check×check, while X and Z checks let one parity map act at a time; open-chain corank is exactly what leaves one logical qubit rather than the toric code's two.",
        "origin": {
          "kind": "canonical"
        },
        "refs": [
          "tillich2009quantum"
        ],
        "rung": "R2",
        "type": "hypergraph-product"
      },
      {
        "description": "The checks are the boundary and coboundary maps of a relative chain complex. Logical strings are relative cycles modulo boundaries, and distance is the shortest nontrivial primal or dual relative cycle.",
