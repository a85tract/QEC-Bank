          "kind": "curated",
          "ref": "bravyi1998quantum"
        },
        "refs": [
          "bravyi1998quantum",
          "bombin2007homological"
        ],
        "rung": "R2",
        "type": "homological"
      },
      {
        "description": "Error chains with a fixed syndrome become disorder sectors of a random-bond Ising model. Maximum-likelihood decoding compares their free energies; minimum-weight matching is the zero-temperature approximation that keeps energy but discards path entropy.",
        "origin": {
          "kind": "curated",
          "ref": "dennis2002topological"
        },
        "refs": [
          "dennis2002topological",
          "wang2003confinement"
        ],
        "rung": "R5",
        "type": "statistical-mechanics"
      },
      {
        "description": "A phase-free ZX diagram and a CSS code encode the same binary linear subspace. In this language rough/smooth merge and split operations become spider maps, so lattice surgery is diagram rewriting rather than an opaque stabilizer schedule.",
