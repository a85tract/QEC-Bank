    "decoders": [
      {
        "id": "mwpm",
        "noise": "independent X/Z noise with perfect syndrome (code capacity)",
        "notes": "Matching reaches about 10.3%, while maximum-likelihood decoding reaches about 10.9% under the corresponding independent-noise convention. The gap is path entropy: matching minimizes chain energy rather than class free energy.",
        "refs": [
          "dennis2002topological",
          "wang2003confinement",
          "higgott2022pymatching"
        ],
        "status": "standard"
      },
      {
        "id": "mwpm",
        "noise": "phenomenological data and syndrome noise over repeated rounds",
        "notes": "The spacetime matching transition is about 2.9% for the symmetric phenomenological model studied by Wang, Harrington, and Preskill. This number is not a circuit-level gate threshold.",
        "refs": [
          "wang2003confinement"
        ],
        "status": "standard"
      },
      {
        "id": "mwpm",
        "noise": "circuit-level depolarizing syndrome-extraction circuit",
        "notes": "Fowler's scheduled eight-step syndrome circuit has a threshold near 0.57% per circuit step, or roughly 4% per full cycle in that paper's stochastic model. The value is schedule-, gate-set-, and decoder-dependent, so it must not be compared directly with the code-capacity figures above.",
        "refs": [
          "fowler2012surface"
        ],
        "status": "standard"
      },
      {
        "id": "union-find",
        "noise": "perfect syndrome and faulty repeated syndrome benchmarks",
        "notes": "The toric-bulk benchmarks give about 9.9% with perfect syndrome and 2.6% with faulty syndrome measurements. Union-find trades a small threshold loss relative to matching for almost-linear worst-case processing.",
        "refs": [
          "delfosse2021almost"
        ],
        "status": "standard"
      },
      {
        "id": "renormalization-group",
        "noise": "code-capacity Pauli noise on surface/toric-code lattices",
        "notes": "Hierarchical coarse-graining estimates the probability of logical classes rather than committing immediately to one globally lightest chain. It exposes a distinct speed/accuracy tradeoff and generalizes naturally to other topological-code lattices.",
        "refs": [
          "duclos2010fast"
        ],
        "status": "standard"
      },
      {
        "id": "tensor-network-mld",
        "noise": "independent X/Z noise exactly; general Pauli noise approximately",
        "notes": "Exact free-fermion contraction is available for the restricted independent channel, while matrix-product-state contraction approximates maximum likelihood for more general noise. The bond dimension controls the accuracy/runtime tradeoff.",
        "refs": [
          "bravyi2014efficient"
        ],
        "status": "standard"
      },
      {
        "id": "bp-osd",
        "noise": "CSS parity-check decoding with calibrated soft information",
        "notes": "Belief propagation supplies qubit reliabilities and ordered-statistics post-processing repairs non-convergence on the lattice's short cycles. It is a portable qLDPC baseline rather than a geometry-specialized decoder.",
        "refs": [
          "roffe2020decoding"
        ],
        "status": "standard"
      },
      {
        "id": "belief-matching",
        "noise": "correlated circuit-level detector faults",
        "notes": "Belief propagation first assigns correlated fault mechanisms to detector events, then reweights a matching graph. This retains the mature matching backend while correcting the independent-edge approximation.",
        "refs": [
          "higgott2023beliefmatching"
        ],
        "status": "standard"
      }
    ],
    "description": "A planar CSS stabilizer code obtained by putting qubits on the edges of a cellulated surface, X checks at vertices, and Z checks around faces. Rough and smooth boundaries absorb the two kinds of error string; a string that joins the complementary boundaries is logical. This unrotated family is constructed exactly as HGP(rep_L, rep_L).",
    "eczoo": {
