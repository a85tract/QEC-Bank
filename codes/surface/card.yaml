  "source": {
    "collection": "atlas",
    "encoding": "utf-8",
    "entry_id": "surface",
    "path": "atlas/surface/card.yaml",
    "sha256": "f60832da28a59e6469a4bac94a3a2137d7559e3a6525b37159b1ae839a11f64f",
    "text": "id: surface\nkind: family\nidentity:\n  canonical_name: \"Surface code\"\n  variant: \"planar, unrotated\"\n  aliases: [\"planar code\", \"Kitaev surface code\"]\npresentation:\n  orienting_view: {status: available, kind: lattice}\n  guided_tour: {status: available}\neczoo:\n  status: mapped\n  zoo_id: surface\n  classification: variant\n  source:\n    repository_url: https://github.com/errorcorrectionzoo/eczoo_data\n    commit: b2437d9e2dc09284e04c66ef72ee81b7ed7bd129\n    retrieved_on: \"2026-08-05\"\n    path: codes/quantum/qubits/stabilizer/topological/surface/2d_surface/surface.yml\n    sha256: 48d0fdd56792ea67ab2ed4f7ec8c7350efe12b4d3128ef60d23c50ea64f0343f\n    page_url: https://errorcorrectionzoo.org/c/surface\n    blob_url: https://github.com/errorcorrectionzoo/eczoo_data/blob/b2437d9e2dc09284e04c66ef72ee81b7ed7bd129/codes/quantum/qubits/stabilizer/topological/surface/2d_surface/surface.yml\ndescription: >-\n  A planar CSS stabilizer code obtained by putting qubits on the edges of a\n  cellulated surface, X checks at vertices, and Z checks around faces. Rough\n  and smooth boundaries absorb the two kinds of error string; a string that\n  joins the complementary boundaries is logical. This unrotated family is\n  constructed exactly as HGP(rep_L, rep_L).\nclaim_gaps:\n  - {property: d, target: wanted:fast-distance}\nviews:\n  - rung: R1\n    type: symplectic-css-checks\n    description: >-\n      Expanding the two repetition-factor boundary maps gives sparse binary X\n      and Z check matrices. Their stacked symplectic rows are the universal\n      executable baseline used for commutation, rank, logical, and distance\n      calculations.\n    origin:\n      kind: derived\n      converter: \"surface.build HGP output -> CheckMatrix.from_css\"\n      version: \"v1\"\n    refs: [tillich2009quantum]\n  - rung: R2\n    type: hypergraph-product\n    description: >-\n      Two open length-L repetition chains form the two axes. The two HGP qubit\n      blocks are bit×bit and check×check, while X and Z checks let one parity\n      map act at a time; open-chain corank is exactly what leaves one logical\n      qubit rather than the toric code's two.\n    origin: {kind: canonical}\n    refs: [tillich2009quantum]\n  - rung: R2\n    type: homological\n    description: >-\n      The checks are the boundary and coboundary maps of a relative chain\n      complex. Logical strings are relative cycles modulo boundaries, and\n      distance is the shortest nontrivial primal or dual relative cycle.\n    origin: {kind: curated, ref: bravyi1998quantum}\n    refs: [bravyi1998quantum, bombin2007homological]\n  - rung: R5\n    type: statistical-mechanics\n    description: >-\n      Error chains with a fixed syndrome become disorder sectors of a\n      random-bond Ising model. Maximum-likelihood decoding compares their free\n      energies; minimum-weight matching is the zero-temperature approximation\n      that keeps energy but discards path entropy.\n    origin: {kind: curated, ref: dennis2002topological}\n    refs: [dennis2002topological, wang2003confinement]\n  - rung: R5\n    type: zx\n    description: >-\n      A phase-free ZX diagram and a CSS code encode the same binary linear\n      subspace. In this language rough/smooth merge and split operations become\n      spider maps, so lattice surgery is diagram rewriting rather than an\n      opaque stabilizer schedule.\n    origin: {kind: curated, ref: kissinger2022phasefree}\n    refs: [kissinger2022phasefree, debeaudrap2020zx, bombin2023unifying]\n  - rung: R5\n    type: fermionic\n    dialect: quon\n    description: >-\n      The toric bulk underlying the planar patch becomes a quantized graph:\n      star and plaquette checks are unified as cycle operators, e/m duality is\n      graph self-duality, and charged string diagrams expose the fermionic\n      composite and twist-defect bookkeeping.\n    origin: {kind: curated, ref: liu2019quantized}\n    refs: [liu2017quon, liu2019quantized]\n    gap: {target: wanted:fermionic-compiler}\n  - rung: R5\n    type: tensor-network\n    description: >-\n      The ground space is a PEPS whose virtual Z2 symmetry generates\n      topological degeneracy, local indistinguishability, and anyonic\n      excitations. The code's topological order is therefore a constraint on\n      the local tensor, not merely a property asserted from its Hamiltonian.\n    origin: {kind: curated, ref: schuch2010peps}\n    refs: [schuch2010peps]\ncategories:\n  - {id: css, origin: {kind: verified}}\n  - {id: topological, origin: {kind: curated, ref: dennis2002topological}}\n  - {id: hypergraph-product, origin: {kind: curated, ref: tillich2009quantum}}\nrefs: [kitaev2003fault, dennis2002topological, tillich2009quantum, bravyi1998quantum,\n       bombin2007homological, fowler2012surface, horsman2012surface, bravyi2009nogo,\n       bravyi2010tradeoffs, bravyi2011energy, bravyi2013classification,\n       bombin2007optimal, bombin2010twist, bonilla2021xzzx, moussa2016transversal,\n       brown2017poking, raussendorf2007fault, bravyi2005magic, wang2003confinement,\n       aharonov1997fault, duclos2010fast, higgott2022pymatching, delfosse2021almost,\n       bravyi2014efficient, higgott2023beliefmatching, roffe2020decoding,\n       google2023suppressing, google2024below, eickbusch2024dynamic,\n       zhao2022realization, bluvstein2024logical, liu2017quon, liu2019quantized,\n       kissinger2022phasefree, debeaudrap2020zx, bombin2023unifying, schuch2010peps,\n       haah2011local, bravyi2024bicycle]\nparams: {L: \"distance (odd or even, L >= 2)\"}\nconstruction:\n  schema: qec-atlas-construction-v1\n  op: {id: hgp, version: 1}\n  inputs:\n    H1:\n      ref: {kind: generator, id: rep_parity, version: 1}\n      params:\n        L: {instance_param: L}\n      output: parity_check\n    H2:\n      ref: {kind: generator, id: rep_parity, version: 1}\n      params:\n        L: {instance_param: L}\n      output: parity_check\n  output: checkmatrix\n  match: exact-checkmatrix-v1\ntier: gold\nfit:\n  platforms: [superconducting-2d-grid, neutral-atom-reconfigurable]\n  tasks: [memory, computation]\ndecoders:\n  - id: mwpm\n    status: standard\n    noise: \"independent X/Z noise with perfect syndrome (code capacity)\"\n    notes: >-\n      Matching reaches about 10.3%, while maximum-likelihood decoding reaches\n      about 10.9% under the corresponding independent-noise convention. The\n      gap is path entropy: matching minimizes chain energy rather than class\n      free energy.\n    refs: [dennis2002topological, wang2003confinement, higgott2022pymatching]\n  - id: mwpm\n    status: standard\n    noise: \"phenomenological data and syndrome noise over repeated rounds\"\n    notes: >-\n      The spacetime matching transition is about 2.9% for the symmetric\n      phenomenological model studied by Wang, Harrington, and Preskill. This\n      number is not a circuit-level gate threshold.\n    refs: [wang2003confinement]\n  - id: mwpm\n    status: standard\n    noise: \"circuit-level depolarizing syndrome-extraction circuit\"\n    notes: >-\n      Fowler's scheduled eight-step syndrome circuit has a threshold near\n      0.57% per circuit step, or roughly 4% per full cycle in that paper's\n      stochastic model. The value is schedule-, gate-set-, and\n      decoder-dependent, so it must not be compared directly with the\n      code-capacity figures above.\n    refs: [fowler2012surface]\n  - id: union-find\n    status: standard\n    noise: \"perfect syndrome and faulty repeated syndrome benchmarks\"\n    notes: >-\n      The toric-bulk benchmarks give about 9.9% with perfect syndrome and 2.6%\n      with faulty syndrome measurements. Union-find trades a small threshold\n      loss relative to matching for almost-linear worst-case processing.\n    refs: [delfosse2021almost]\n  - id: renormalization-group\n    status: standard\n    noise: \"code-capacity Pauli noise on surface/toric-code lattices\"\n    notes: >-\n      Hierarchical coarse-graining estimates the probability of logical classes\n      rather than committing immediately to one globally lightest chain. It\n      exposes a distinct speed/accuracy tradeoff and generalizes naturally to\n      other topological-code lattices.\n    refs: [duclos2010fast]\n  - id: tensor-network-mld\n    status: standard\n    noise: \"independent X/Z noise exactly; general Pauli noise approximately\"\n    notes: >-\n      Exact free-fermion contraction is available for the restricted independent\n      channel, while matrix-product-state contraction approximates maximum\n      likelihood for more general noise. The bond dimension controls the\n      accuracy/runtime tradeoff.\n    refs: [bravyi2014efficient]\n  - id: bp-osd\n    status: standard\n    noise: \"CSS parity-check decoding with calibrated soft information\"\n    notes: >-\n      Belief propagation supplies qubit reliabilities and ordered-statistics\n      post-processing repairs non-convergence on the lattice's short cycles. It\n      is a portable qLDPC baseline rather than a geometry-specialized decoder.\n    refs: [roffe2020decoding]\n  - id: belief-matching\n    status: standard\n    noise: \"correlated circuit-level detector faults\"\n    notes: >-\n      Belief propagation first assigns correlated fault mechanisms to detector\n      events, then reweights a matching graph. This retains the mature matching\n      backend while correcting the independent-edge approximation.\n    refs: [higgott2023beliefmatching]\nrealizations:\n  - platform: \"Google superconducting square-grid processors\"\n    status: demonstrated\n    description: >-\n      Scaling from distance 3 to distance 5 reduced logical error per cycle\n      from the distance-3 ensemble average 3.028% ± 0.023% to\n      2.914% ± 0.016%. This is the 2023 distance-scaling result; it did not\n      report the later Willow suppression factor.\n    refs: [google2023suppressing]\n  - platform: \"Google Willow superconducting processor\"\n    status: demonstrated\n    description: >-\n      A distance-7 patch reached 0.143% ± 0.003% logical error per cycle and\n      each distance increase of two suppressed error by\n      Λ = 2.14 ± 0.02, with logical lifetime beyond the best physical qubit.\n    refs: [google2024below]\n  - platform: \"Google Willow dynamic superconducting layouts\"\n    status: demonstrated\n    description: >-\n      Hexagonal-connectivity, walking data/measure-role, and iSWAP-based\n      surface-code schedules all showed distance-dependent error suppression,\n      demonstrating that the code can be adapted to connectivity, leakage,\n      and native-gate constraints.\n    refs: [eickbusch2024dynamic]\n  - platform: \"USTC Zuchongzhi 2.1 superconducting processor\"\n    status: demonstrated\n    description: >-\n      A 17-qubit distance-3 Surface-17 patch executed repeated correction\n      cycles, providing an independent superconducting realization of a\n      planar surface-code memory.\n    refs: [zhao2022realization]\n  - platform: \"reconfigurable neutral-atom arrays\"\n    status: demonstrated\n    description: >-\n      Movable atoms realized surface-code patches inside a multi-code logical\n      processor and enabled transversal inter-patch entangling gates by\n      aligning corresponding data qubits. This is a logical-operations\n      demonstration, not a below-threshold surface-memory claim; for the\n      distance-five and distance-seven surface blocks, logical input-state\n      preparation was not itself fault-tolerant.\n    refs: [bluvstein2024logical]\nrelations:\n  - {type: product_of, target: hgp, how: \"HGP(rep_L, rep_L) — the planar surface code is the hypergraph product of two repetition codes\", refs: [tillich2009quantum]}\n  - {type: same_bulk_phase_as, target: toric, how: \"The same square-lattice star/plaquette bulk is obtained from HGP(rep_L, rep_L); open repetition factors give the planar Surface patch, while periodic factors close it into the toric code.\", refs: [kitaev2003fault, dennis2002topological, tillich2009quantum]}\noperations:\n  - {gate: \"CNOT\", mechanism: surgery, level: \"Clifford\", cost: \"O(d) rounds per merge/split plus an ancilla routing patch\", origin: {kind: claimed, ref: horsman2012surface}}\n  - {gate: \"CNOT\", mechanism: transversal, level: \"Clifford\", cost: \"constant-depth physical CNOT layer; transport and correlated-decoding costs remain\", origin: {kind: claimed, ref: bluvstein2024logical}}\n  - {gate: \"CNOT\", mechanism: braiding, level: \"Clifford\", cost: \"O(d) or more rounds and a distance-sized reserved hole trajectory\", origin: {kind: claimed, ref: fowler2012surface}}\n  - {gate: \"single-qubit Clifford\", mechanism: braiding, level: \"Clifford\", cost: \"twist/corner code deformation over distance-preserving paths\", origin: {kind: claimed, ref: brown2017poking}}\n  - {gate: \"H / S\", mechanism: fold-transversal, level: \"Clifford\", cost: \"constant-depth gates plus a fold or equivalent qubit permutation\", origin: {kind: claimed, ref: moussa2016transversal}}\n  - {gate: \"logical |0> / |+> initialization\", mechanism: measurement-based, level: \"stabilizer preparation\", cost: \"prepare a physical product state, measure the complementary stabilizers for d rounds, and decode the spacetime record\", origin: {kind: claimed, ref: fowler2012surface}}\n  - {gate: \"logical Z / X readout\", mechanism: measurement-based, level: \"stabilizer measurement\", cost: \"destructively measure all data qubits in the selected basis and decode the final data/syndrome history\", origin: {kind: claimed, ref: fowler2012surface}}\n  - {gate: \"Pauli-frame update\", mechanism: measurement-based, level: \"Clifford bookkeeping\", cost: \"a classical frame update after decoded logical measurements; no immediate physical Pauli layer is required\", origin: {kind: claimed, ref: fowler2012surface}}\n  - {gate: \"T\", mechanism: measurement-based, level: \"non-Clifford\", cost: \"inject and distill a magic state, then consume it by gate teleportation; factory spacetime dominates\", origin: {kind: claimed, ref: bravyi2005magic}}\n",
