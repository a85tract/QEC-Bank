version: 1
title: "Surface code: see the hypergraph product"
subtitle: "Two repetition chains become checks, boundaries, and one protected qubit."
design_inspiration:
  label: "M. Lutz, Toric code as a hypergraph product"
  url: "https://lutzm.ax/toric-code-hypergraph-product/"
lattices:
  open: {entry: surface, instance: L3, label: "open / planar"}
  periodic: {entry: toric, instance: L3, label: "periodic / toric"}
check_notes:
  open:
    "0": {label: "A check 0 × B bit 0", explanation: "The first repetition relation acts in factor A while factor B is held at its left endpoint."}
    "1": {label: "A check 0 × B bit 1", explanation: "The H₁⊗I block acts along factor A; the I⊗H₂ᵀ block supplies the adjacent face qubits."}
    "2": {label: "A check 0 × B bit 2", explanation: "The same factor-A relation reaches the right endpoint of factor B."}
    "3": {label: "A check 1 × B bit 0", explanation: "The second factor-A relation is copied at the left endpoint of factor B."}
    "4": {label: "A check 1 × B bit 1", explanation: "A bulk X-check combines one relation of A with one bit of B."}
    "5": {label: "A check 1 × B bit 2", explanation: "Open factor-B incidence removes one neighboring face term at the endpoint."}
    "6": {label: "A bit 0 × B check 0", explanation: "The Z family reverses the roles: a bit of A is paired with a repetition relation of B."}
    "7": {label: "A bit 0 × B check 1", explanation: "The second factor-B relation is copied at the first bit of A."}
    "8": {label: "A bit 1 × B check 0", explanation: "The I⊗H₂ block acts along factor B while H₁ᵀ⊗I supplies adjacent face qubits."}
    "9": {label: "A bit 1 × B check 1", explanation: "This bulk Z-check is the transpose partner of the bulk X construction."}
    "10": {label: "A bit 2 × B check 0", explanation: "The first factor-B relation is copied at the final bit of A."}
    "11": {label: "A bit 2 × B check 1", explanation: "The open endpoint in factor A removes one neighboring face term."}
  periodic:
    "0": {label: "Periodic vertex check", explanation: "Closing both repetition chains removes endpoints, so this star has four incident edge qubits."}
    "9": {label: "Periodic plaquette check", explanation: "The periodic face has four boundary edges and no distinguished outer boundary."}
steps:
  - title: "Start with two open repetition chains"
    narrative: "For L=3 each factor has three bits and two parity relations. Their hypergraph product places nine bit×bit qubits and four check×check qubits: the 13 coordinates shown here are computed by the surface constructor."
    state: {lattice: open, filter: all}
    origin: {kind: verified, method: "surface.build(L=3)"}
    refs: [tillich2009quantum]
  - title: "An X-check acts one factor at a time"
    narrative: "The highlighted bulk X-check is indexed by a parity relation of factor A and a bit of factor B. Its support is the union of H₁⊗I and I⊗H₂ᵀ contributions; hover nearby X-checks to watch the copied factor indices change."
    state: {lattice: open, filter: X, highlight: 1}
    origin: {kind: verified, method: "qeclib.constructions.hgp"}
    refs: [tillich2009quantum]
  - title: "Z-checks exchange the factor roles"
    narrative: "The highlighted Z-check pairs a bit of A with a parity relation of B. Its two matrix blocks are I⊗H₂ and H₁ᵀ⊗I, which is why the X and Z families cross yet commute."
    state: {lattice: open, filter: Z, highlight: 8}
    origin: {kind: verified, method: "qeclib.constructions.hgp"}
    refs: [tillich2009quantum]
  - title: "Close the chains: the toric sibling"
    narrative: "Switching to the periodic lattice removes both endpoints. Every displayed star and plaquette has weight four, the lattice has 18 edge qubits at L=3, and the torus carries two logical qubits instead of the planar patch's one."
    state: {lattice: periodic, filter: all, highlight: 0}
    origin: {kind: verified, method: "toric.build(L=3)"}
    refs: [kitaev2003fault, dennis2002topological]
  - title: "Open boundaries are missing incidences"
    narrative: "Return to the planar product and inspect the highlighted boundary X-check. Its weight is three because an open repetition endpoint has only one neighboring relation; the boundary is algebraic corank made visible."
    state: {lattice: open, filter: X, highlight: 0}
    origin: {kind: verified, method: "surface.build(L=3)"}
    refs: [dennis2002topological, tillich2009quantum]
  - title: "The two check families tile the same qubits"
    narrative: "Show all checks again. X and Z supports overlap evenly because the two identical Kronecker contributions to H_X H_Zᵀ cancel over GF(2); the constructor validates that commutation before exporting this lattice."
    state: {lattice: open, filter: all, highlight: 4}
    origin: {kind: verified, method: "CheckMatrix.validate"}
    refs: [tillich2009quantum]
  - title: "Now interrogate the construction yourself"
    narrative: "Hover any check. The callout names its factor-A × factor-B index and lists the exact qubit support. Toggle X/Z and open/periodic views: the same generic player is reading tour data and constructor exports, with no surface-specific JavaScript."
    state: {lattice: open, filter: all}
    origin: {kind: verified, method: "data-driven tour player"}
    refs: [tillich2009quantum]
