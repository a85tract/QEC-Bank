# Code-specific pedagogy over shared constructor-driven lattice explorers.
version: 1
title: "Bivariate bicycle: from torus shifts to the gross memory"
subtitle: "Compare the exact gross incidence with a small toric anchor; no BB-specific JavaScript."
lattices:
  gross:
    {entry: bivariate_bicycle, instance: gross, label: "Gross [[144,12,12]]"}
  toric:
    {entry: bivariate_bicycle, instance: toric_L3, label: "Toric anchor [[18,2,3]]"}
steps:
  - title: "Begin with two qubits per torus site"
    narrative: "The gross view contains 72 sites in each of two interleaved data layers. All 144 coordinates and all check supports come from constructor.py; the drawing is not a hand-authored lattice."
    state: {lattice: gross, filter: all, highlight: 0}
    origin: {kind: verified, method: "bivariate_bicycle.build lattice/checkmatrix export"}
    refs: [bravyi2024bicycle]
  - title: "Read one X check as six translations"
    narrative: "Gross X check 0 touches left-block qubits 1, 2, and 18 from A=x^3+y+y^2, then right-block qubits 75, 78, and 84 from B=y^3+x+x^2. Three plus three gives weight six."
    state: {lattice: gross, filter: X, highlight: 0}
    origin: {kind: verified, method: "gross HX row 0 support asserted in reproduce.py"}
    refs: [bravyi2024bicycle]
  - title: "The swapped transpose builds the Z partner"
    narrative: "Gross Z check 0 touches 3, 60, 66, 76, 77, and 126. Transpose reverses every torus translation, while swapping A and B makes every X/Z overlap evaluate to AB+BA=0."
    state: {lattice: gross, filter: Z, highlight: 72}
    origin: {kind: verified, method: "gross HZ row 0 support and HX HZ-transpose check"}
    refs: [bravyi2024bicycle, wang2023abelian]
  - title: "Shrink to the toric convention test"
    narrative: "Switch to A=1+x and B=1+y on a 3-by-3 torus. The same constructor now returns 18 qubits, two logical qubits, and exact distance three. This anchors the convention without reducing the gross block to toric copies."
    state: {lattice: toric, filter: all, highlight: 0}
    origin: {kind: verified, method: "exact-css-enum on toric_L3"}
    refs: [mackay2004sparse, chen2025anyon]
  - title: "See a four-body toric X check"
    narrative: "The highlighted toric X row contains two terms from 1+x on the left block and two from 1+y on the right. The weight changes from six to four because sparsity follows the polynomial term count."
    state: {lattice: toric, filter: X, highlight: 0}
    origin: {kind: verified, method: "toric_L3 HX row 0 from constructor"}
    refs: [mackay2004sparse]
  - title: "Return to the rank-defect design problem"
    narrative: "Back on gross, 72 rows of each Pauli type have rank 66 rather than 72. The two six-dimensional deficits leave twelve logical qubits. Hovering another check changes incidence, not rank: k comes from the global quotient generated by A and B."
    state: {lattice: gross, filter: X, highlight: 1}
    origin: {kind: verified, method: "qeclib.gf2.rank on gross HX and HZ"}
    refs: [postema2025existence, bravyi2024bicycle]
  - title: "Separate the static code from its circuit"
    narrative: "The explorer certifies stabilizer incidence only. It does not draw ancillas, CNOT order, detectors, or hook propagation. The reported depth-seven extraction and 0.8% family threshold belong to a separate standard-circuit-noise plus BP-OSD experiment."
    state: {lattice: gross, filter: all, highlight: 0}
    origin: {kind: curated, ref: bravyi2024bicycle}
    refs: [bravyi2024bicycle, roffe2020decoding]
  - title: "Interrogate what a symmetry actually buys"
    narrative: "Torus translations preserve these supports as a set, so they are physical code automorphisms. That alone does not name a logical gate: the induced action on the twelve logical Pauli pairs and the routing cost must still be computed for the chosen block."
    state: {lattice: gross, filter: Z, highlight: 73}
    origin: {kind: verified, method: "translation row-permutation identities in reproduce.py"}
    refs: [sayginel2025automorphisms, eberhardt2024fold]
