        "notes": "The original end-to-end study reports a 0.8% circuit-level threshold for its BB memory family under the standard circuit-noise model, depth-seven extraction, and BP-OSD. It is not a decoder-independent threshold of every BB construction: changing the family, CNOT order, detector model, noise normalization, or postprocessing defines a different threshold experiment.",
