        "id": "eczoo-entity:qcga#collection",
        "kind": "entity"
      },
      "content": {
        "description": "A and B are sparse elements of F_2[x,y]/(x^l-1,y^m-1). Monomials are torus translations, transpose reverses a translation, and the two CSS check families are assembled without solving pairwise commutation constraints.",
        "origin": {
          "kind": "canonical"
        },
