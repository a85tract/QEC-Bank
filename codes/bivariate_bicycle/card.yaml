    "sha256": "c552e97d6ce5856ffa8af59112c81884552e8acd39f3dc418d26e134b21a5fd4",
    "text": "id: bivariate_bicycle\nkind: family\nidentity:\n  canonical_name: \"Bivariate bicycle code\"\n  aliases: [\"BB code\", \"gross code (l=12, m=6 instance)\"]\npresentation:\n  orienting_view: {status: available, kind: lattice}\n  guided_tour: {status: available}\neczoo:\n  status: mapped\n  zoo_id: qcga\n  classification: exact-family\n  source:\n    repository_url: https://github.com/errorcorrectionzoo/eczoo_data\n    commit: b2437d9e2dc09284e04c66ef72ee81b7ed7bd129\n    retrieved_on: \"2026-08-05\"\n    path: codes/quantum/qubits/stabilizer/qldpc/balanced_product/lp/bb/qcga.yml\n    sha256: 83ce75676b44561fbc7288fd030ead8af678152843bc1f3fa34fd9a800d71e24\n    page_url: https://errorcorrectionzoo.org/c/qcga\n    blob_url: https://github.com/errorcorrectionzoo/eczoo_data/blob/b2437d9e2dc09284e04c66ef72ee81b7ed7bd129/codes/quantum/qubits/stabilizer/qldpc/balanced_product/lp/bb/qcga.yml\ndescription: >-\n  A translation-invariant CSS qLDPC family built from two sparse binary\n  polynomials on a finite two-dimensional torus. Each polynomial becomes a\n  cyclic-shift matrix; placing the two matrices in H_X=[A|B] and the swapped\n  transposes in H_Z=[B^T|A^T] makes commutation follow from the abelian\n  polynomial algebra. Representative finite blocks trade planar\n  nearest-neighbor layout for a second coupling layer and encode many logical\n  qubits at moderate distance.\nclaim_gaps:\n  - {property: d, target: wanted:fast-distance}\nviews:\n  - rung: R1\n    type: symplectic-css-checks\n    description: >-\n      Expanding every polynomial monomial as a torus translation produces two\n      sparse binary CSS matrices. Stacking their X and Z rows in symplectic\n      form is the universal executable baseline used for rank, logical, and\n      distance computations.\n    origin:\n      kind: derived\n      converter: \"bivariate_bicycle.build -> CheckMatrix.from_css\"\n      version: \"v1\"\n    refs: [bravyi2024bicycle]\n  - rung: R5\n    type: bivariate-polynomial\n    description: >-\n      A and B are sparse elements of F_2[x,y]/(x^l-1,y^m-1). Monomials are\n      torus translations, transpose reverses a translation, and the two CSS\n      check families are assembled without solving pairwise commutation\n      constraints.\n    origin: {kind: canonical}\n    refs: [bravyi2024bicycle]\n  - rung: R5\n    type: group-algebra\n    description: >-\n      The polynomial ring is the regular representation of the abelian group\n      Z_l x Z_m. This view isolates the exact reason A and B commute and places\n      BB codes inside two-block group-algebra codes without identifying the\n      two families.\n    origin: {kind: curated, ref: wang2023abelian}\n    refs: [wang2023abelian, lin2023twoblock]\n  - rung: R2\n    type: homological\n    description: >-\n      The matrices form the three-term CSS complex R -> R^2 -> R with boundary\n      maps [B;A] and [A|B]. Logical operators are middle homology classes, and\n      the gross code's twelve logical qubits are the quotient dimension left\n      after the two rank-66 boundary maps.\n    origin:\n      kind: derived\n      converter: \"bivariate_bicycle.build checkmatrix-to-CSS-complex\"\n      version: \"v1\"\n    refs: [lin2023twoblock, bravyi2024bicycle]\n  - rung: R4\n    type: tanner-circuit\n    description: >-\n      Each weight-six check joins three qubits in each data layer. The Tanner\n      incidence can be split into two planar degree-three coupling layers,\n      turning sparse monomials into a concrete syndrome-extraction graph while\n      keeping the schedule and detector model separate from the static code.\n    origin: {kind: curated, ref: bravyi2024bicycle}\n    refs: [bravyi2024bicycle, shaw2025morphing]\n  - rung: R5\n    type: quotient-module\n    description: >-\n      The common quotient R/(A,B) controls the number of encoded qubits.\n      Polynomial factors and common roots explain when that quotient appears,\n      why finite blocks can have high rate, and why the studied subclass is\n      not an asymptotically good family.\n    origin: {kind: curated, ref: postema2025existence}\n    refs: [postema2025existence]\n  - rung: R5\n    type: anyon-koszul\n    description: >-\n      The same polynomial ideal can be read as excitation sectors, mobility\n      constraints, and logical strings through a Koszul complex. This view\n      exposes topological frustration and blocks the shortcut of declaring\n      every finite BB code a trivial stack of independent toric codes.\n    origin: {kind: curated, ref: chen2025anyon}\n    refs: [chen2025anyon]\n  - rung: R2\n    type: toric-cylinder\n    description: >-\n      For decoding, selected symmetries reduce parts of the syndrome problem\n      to toric-code-like cylinders on which matching applies. The reduction is\n      an operational decoder dictionary, not a global phase equivalence.\n    origin: {kind: curated, ref: sahay2026matching}\n    refs: [sahay2026matching]\ncategories:\n  - {id: css, origin: {kind: verified}}\n  - {id: qldpc, origin: {kind: curated, ref: bravyi2024bicycle}}\nrefs:\n  - mackay2004sparse\n  - panteleev2021degenerate\n  - wang2023abelian\n  - lin2023twoblock\n  - bravyi2024bicycle\n  - postema2025existence\n  - chen2025anyon\n  - voss2025multivariate\n  - wang2026coprime\n  - eberhardt2024pruning\n  - liang2025planar\n  - steffan2025tile\n  - liang2025selfdual\n  - roffe2020decoding\n  - shaw2025morphing\n  - koutsioumpas2025autdec\n  - blue2026machine\n  - sahay2026matching\n  - pakhunov2026convergence\n  - pakhunov2026peeling\n  - cohen2022longrange\n  - xu2023constant\n  - eberhardt2024fold\n  - sayginel2025automorphisms\n  - breuckmann2026cups\n  - yoder2025tour\n  - xu2025batched\n  - wang2026lowoverhead\n  - poole2025rydberg\n  - berthusen2025local\n  - chen2025fusion\n  - chandra2026distributed\nparams:\n  l: \"positive cyclic order of x\"\n  m: \"positive cyclic order of y\"\n  a_terms: \"integer exponent pairs for the monomials of A, reduced modulo (l,m)\"\n  b_terms: \"integer exponent pairs for the monomials of B, reduced modulo (l,m)\"\nconstruction:\n  schema: qec-atlas-construction-v1\n  op: {id: bivariate_bicycle, version: 1}\n  inputs:\n    A:\n      ref: {kind: generator, id: bivariate_polynomial, version: 1}\n      params:\n        l: {instance_param: l}\n        m: {instance_param: m}\n        terms: {instance_param: a_terms}\n      output: parity_check\n    B:\n      ref: {kind: generator, id: bivariate_polynomial, version: 1}\n      params:\n        l: {instance_param: l}\n        m: {instance_param: m}\n        terms: {instance_param: b_terms}\n      output: parity_check\n  output: checkmatrix\n  match: exact-checkmatrix-v1\ntier: T3\nfit:\n  platforms:\n    [superconducting-long-range, neutral-atom-reconfigurable, modular-networked]\n  tasks: [memory, modular-computation]\ndecoders:\n  - id: bp-osd\n    status: standard\n    noise: \"memoryless Pauli and phenomenological qLDPC benchmarks\"\n    notes: >-\n      Belief propagation supplies soft reliabilities and ordered-statistics\n      postprocessing repairs many failures caused by degeneracy and short\n      Tanner-graph cycles. Performance belongs to the stated channel and\n      stopping/OSD settings, not to the bare check matrix.\n    refs: [roffe2020decoding, panteleev2021degenerate]\n  - id: bp-osd\n    status: research-grade\n    noise: \"circuit detector model for the seven-CNOT-layer extraction schedule\"\n    notes: >-\n      The original end-to-end study reports a 0.8% circuit-level threshold\n      for its BB memory family under the standard circuit-noise model,\n      depth-seven extraction, and BP-OSD. It is not a decoder-independent\n      threshold of every BB construction: changing the family, CNOT order,\n      detector model, noise normalization, or postprocessing defines a\n      different threshold experiment.\n    refs: [bravyi2024bicycle]\n  - id: mwpm\n    status: research-grade\n    noise: \"BB symmetry reduction to toric-code-like cylinders\"\n    notes: >-\n      A cylinder construction exposes matching subproblems and can be combined\n      with BP and over-matching. Its certificate is the specific symmetry\n      reduction; it does not turn every BB instance into independent toric\n      codes.\n    refs: [sahay2026matching]\nrealizations:\n  - platform: \"Kunlun long-range-coupled superconducting processor\"\n    status: demonstrated\n    description: >-\n      A [[18,4,4]] BB block used 32 transmons to execute all nonlocal\n      weight-six checks and repeated syndrome cycles. The reported logical\n      error per logical qubit per cycle was (8.91 +/- 0.17)%; this establishes\n      feasibility, not below-threshold scaling and not a gross-code run.\n    refs: [wang2026lowoverhead]\n  - platform: \"optimized Rydberg neutral-atom layout\"\n    status: proposed\n    description: >-\n      Gate routing and Rydberg interactions were co-designed for BB\n      connectivity. The result is a numerical architecture proposal rather\n      than a laboratory logical-memory demonstration.\n    refs: [poole2025rydberg]\n  - platform: \"layered two-dimensional hardware\"\n    status: proposed\n    description: >-\n      Motion or communication embeds long-range BB checks in a locally\n      connected device, including schedules that measure some costly checks\n      less often. The altered cadence and circuit noise must be decoded as\n      part of the proposal.\n    refs: [berthusen2025local]\n  - platform: \"degree-five morphing-circuit layout\"\n    status: proposed\n    description: >-\n      A related BB family lowers connectivity from degree six to five and uses\n      six CNOT rounds by morphing the code during extraction. It changes the\n      family and detector model; it is not a cheaper schedule for every BB\n      block.\n    refs: [shaw2025morphing]\n  - platform: \"modular gross-code architecture\"\n    status: proposed\n    description: >-\n      An instruction set, compiler, and end-to-end resource model organize\n      distance-12 and distance-18 BB modules into a computer. This closes an\n      architecture gap but remains a proposal, not a hardware realization.\n    refs: [yoder2025tour]\nrelations:\n  - type: special_case_of\n    target: two_bga\n    how: >-\n      Bivariate bicycle codes are the abelian two-block group-algebra codes\n      for Z_l x Z_m; general 2BGA codes may use other groups and need not have\n      a two-variable polynomial presentation.\n    refs: [wang2023abelian, lin2023twoblock]\noperations:\n  - gate: \"CNOT between identical BB blocks\"\n    mechanism: transversal\n    level: \"Clifford\"\n    cost: >-\n      one aligned pairwise physical-CNOT layer; module transport, alignment,\n      and correlated decoding are additional architecture costs\n    origin: {kind: claimed, ref: yoder2025tour}\n  - gate: \"selected logical Clifford generators\"\n    mechanism: fold-transversal\n    level: \"Clifford\"\n    cost: >-\n      a fold/permutation plus constant-depth physical Clifford layers; only\n      symmetric BB instances with a resolved logical action qualify\n    origin: {kind: claimed, ref: eberhardt2024fold}\n  - gate: \"logical Clifford operations through automorphisms\"\n    mechanism: fold-transversal\n    level: \"Clifford\"\n    cost: >-\n      a certified Tanner-graph permutation and its physical routing; the\n      induced symplectic action must be computed for the chosen block\n    origin: {kind: claimed, ref: sayginel2025automorphisms}\n  - gate: \"inter-block Pauli measurements and Clifford surgery\"\n    mechanism: surgery\n    level: \"Clifford\"\n    cost: >-\n      long-range ancilla patches, repeated measurements, and a joint decoder;\n      the resource count belongs to the selected modular protocol\n    origin: {kind: claimed, ref: yoder2025tour}\n  - gate: \"H / S / CNOT in the self-dual BB subfamily\"\n    mechanism: transversal\n    level: \"Clifford\"\n    cost: >-\n      constant-depth physical layers on blocks satisfying the extra\n      self-duality and twisted-torus conditions; not a gross-code claim\n    origin: {kind: claimed, ref: liang2025selfdual}\n",
    "version": "qec-atlas-card-v1"
