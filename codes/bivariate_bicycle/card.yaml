      "content": {
        "description": "A [[18,4,4]] BB block used 32 transmons to execute all nonlocal weight-six checks and repeated syndrome cycles. The reported logical error per logical qubit per cycle was (8.91 +/- 0.17)%; this establishes feasibility, not below-threshold scaling and not a gross-code run.",
