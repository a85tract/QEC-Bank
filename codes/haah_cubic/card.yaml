    "sha256": "ca4f4b690759f1722de19f3a26734e7e22f3b993815a5ab3b9b3294911c62199",
    "text": "id: haah_cubic\nkind: family\nidentity:\n  canonical_name: \"Haah cubic code\"\n  variant: \"periodic qubit CSS Code 1\"\n  aliases:\n    - \"Haah's code\"\n    - \"cubic Code 1\"\n    - \"type-II fracton code\"\npresentation:\n  orienting_view: {status: available, kind: lattice}\n  guided_tour: {status: available}\neczoo:\n  status: mapped\n  zoo_id: haah_cubic\n  classification: exact-family\n  source:\n    repository_url: https://github.com/errorcorrectionzoo/eczoo_data\n    commit: b2437d9e2dc09284e04c66ef72ee81b7ed7bd129\n    retrieved_on: \"2026-08-05\"\n    path: codes/quantum/qubits/stabilizer/fracton/haah_cubic.yml\n    sha256: 6edec7f7f3650eb6b9db08bcaadb4738780911b828079abec95635b25b17345f\n    page_url: https://errorcorrectionzoo.org/c/haah_cubic\n    blob_url: https://github.com/errorcorrectionzoo/eczoo_data/blob/b2437d9e2dc09284e04c66ef72ee81b7ed7bd129/codes/quantum/qubits/stabilizer/fracton/haah_cubic.yml\ndescription: >-\n  Haah's cubic code here means CSS Code 1 of the founding classification: a\n  pair of data qubits occupies every vertex of a periodic cubic lattice, and\n  one X-type plus one inversion-related Z-type corner pattern is translated\n  over every cube. Its encoded dimension depends arithmetically on the\n  periodic length rather than following one size-independent degeneracy\n  formula. The no-string theorem excludes arbitrarily long nontrivial logical\n  string segments of fixed width; it does not say that logical operators are\n  absent, and it is not by itself a proof of thermodynamic self-correction.\n  The orienting visual is explicitly a two-dimensional projection of the\n  constructor's three-dimensional data, not a planar embedding.\nclaim_gaps:\n  - {property: d, target: wanted:fast-distance}\nviews:\n  - rung: R1\n    type: symplectic-css-checks\n    description: >-\n      Periodic translation expands the two local X patterns and their inverted\n      Z partners into sparse binary CSS matrices. The stacked symplectic rows\n      are the finite executable baseline used for commutation, rank, logical,\n      and small-distance calculations.\n    origin:\n      kind: derived\n      converter: \"haah_cubic.build periodic offsets -> CheckMatrix.from_css\"\n      version: \"v1\"\n    refs: [haah2011local]\n  - rung: R2\n    type: cube-corner-css\n    description: >-\n      At each cubic vertex, orbital A and orbital B receive different Pauli\n      factors. For the X generator their supports are the monomials of\n      1+x+y+z and 1+xy+yz+zx. Spatial inversion followed by exchanging the\n      orbitals gives the Z generator. Keeping the complete corner table is\n      essential: the phrase “two checks per cube” also describes inequivalent\n      models in the founding classification.\n    origin: {kind: canonical}\n    refs: [haah2011local]\n  - rung: R5\n    type: laurent-polynomial-module\n    description: >-\n      Translation becomes multiplication by Laurent monomials, so the infinite\n      stabilizer family is stored in two compact polynomial columns. A finite\n      periodic instance imposes x^L=y^L=z^L=1 and expands every translate into\n      binary CSS rows. Matrix rank then computes k for that particular L; it\n      must not be replaced by a guessed smooth scaling law.\n    origin:\n      kind: derived\n      converter: \"constructor._X_OFFSETS/_Z_OFFSETS -> periodic binary CSS rows\"\n      version: \"v1\"\n    refs: [haah2011local, williamson2016fractal]\n  - rung: R5\n    type: no-string-logical-segments\n    description: >-\n      “No string logical operator” is a statement about bounded-width logical\n      segments whose length can grow without bound. The proof deforms long\n      candidate segments until their nontrivial part disconnects. Periodic\n      plane and fractal logical operators remain, so replacing “no string” by\n      “no logical” would reverse the content of the theorem.\n    origin: {kind: curated, ref: haah2011local}\n    refs: [haah2011local]\n  - rung: R5\n    type: fractal-syndrome-geometry\n    description: >-\n      Local Pauli faults create bounded clusters of cube defects, but isolated\n      fracton charge cannot be transported by an ordinary Pauli string. Error\n      patterns and neutral clusters therefore organize recursively rather than\n      as pairs joined by shortest paths, motivating the family-specific\n      renormalization decoder.\n    origin: {kind: curated, ref: bravyi2011selfcorrection}\n    refs: [haah2011local, bravyi2011selfcorrection]\n  - rung: R5\n    type: bifurcating-renormalization\n    description: >-\n      Coarse-graining does not return one copy of the same phase as an ordinary\n      fixed-point topological model would. The cubic model bifurcates into\n      multiple sectors, which is a structural phase diagnostic rather than a\n      numerical decoder claim or a finite-size degeneracy formula.\n    origin: {kind: curated, ref: haah2014bifurcation}\n    refs: [haah2014bifurcation, dua2019bifurcating]\n  - rung: R5\n    type: ungauged-fractal-symmetry\n    description: >-\n      Ungauging turns the stabilizer constraints into a model with fractal\n      subsystem symmetries. This dictionary explains why the natural conserved\n      structures are neither ordinary global symmetries nor freely deformable\n      strings; it changes representation and should not be reported as a\n      logical gate on a fixed periodic block.\n    origin: {kind: curated, ref: williamson2016fractal}\n    refs: [williamson2016fractal, vijay2016fracton]\ncategories:\n  - {id: css, origin: {kind: verified}}\n  - {id: qldpc, origin: {kind: curated, ref: haah2011local}}\n  - {id: topological, origin: {kind: curated, ref: vijay2016fracton}}\nrefs:\n  - haah2011local\n  - bravyi2011energy\n  - bravyi2011selfcorrection\n  - haah2014bifurcation\n  - williamson2016fractal\n  - vijay2016fracton\n  - panteleev2021degenerate\n  - tian2018manifolds\n  - tian2019generalized\n  - dua2019compactifying\n  - dua2019bifurcating\n  - aitchison2023boundaries\n  - song2021defect\nparams:\n  L: >-\n    Linear period of the cubic three-torus. The constructor accepts integer\n    L at least two, places a pair of qubits at each vertex, and computes the\n    encoded dimension from binary ranks for that exact period.\nvisual_instance: L3_periodic\ntier: T2\nfit:\n  platforms:\n    - three-dimensional-local-interaction-architecture\n    - Hamiltonian-quantum-memory-model\n  tasks:\n    - fracton-quantum-memory-theory\n    - finite-period-degeneracy-study\n    - three-dimensional-decoder-research\ndecoders:\n  - id: renormalization-group\n    status: research-grade\n    noise: >-\n      thermal or phenomenological local Pauli faults with perfect access to\n      the violated cubic-code stabilizers\n    notes: >-\n      The decoder clusters defects over increasing length scales and locally\n      neutralizes clusters compatible with bounded errors. Its reported memory\n      behavior belongs to the specified thermal dynamics and canonical cubic\n      family; it is not a circuit-level repeated-measurement threshold.\n    refs: [bravyi2011selfcorrection, haah2011local]\n  - id: bp-osd\n    status: research-grade\n    noise: >-\n      code-capacity Pauli noise represented only by the exported sparse binary\n      CSS matrix\n    notes: >-\n      BP-OSD is a generic qLDPC matrix baseline, not a theorem about fracton\n      syndrome geometry. Its performance and tuning cannot be transferred\n      from unrelated sparse codes to this periodic family without a dedicated\n      benchmark.\n    refs: [panteleev2021degenerate]\n  - id: none-known\n    status: none-known\n    gap: {target: wanted:decoders-3d-fracton}\n    noise: >-\n      a fully specified repeated syndrome-extraction circuit with data,\n      measurement, leakage, and correlated hardware faults\n    notes: >-\n      No primary circuit-level threshold for exact CSS Code 1 was found in the\n      dated search completed on 2026-08-09. The actionable scalable-decoder and\n      benchmark gap is routed to wanted:decoders-3d-fracton.\n    refs: [haah2011local, bravyi2011selfcorrection]\nrealizations:\n  - platform: \"three-dimensional commuting-projector spin Hamiltonian\"\n    status: proposed\n    description: >-\n      The translated X and Z cube checks define mutually commuting local\n      Hamiltonian terms whose common ground space is the code space. This is a\n      theoretical model definition, not a preparation circuit, repeated\n      syndrome-extraction protocol, or laboratory demonstration; no primary\n      experiment implementing exact CSS Code 1 was found as of 2026-08-09.\n    refs: [haah2011local, vijay2016fracton]\nrelations:\n  - type: special_case_of\n    target: generalized_haah\n    how: >-\n      The canonical entry fixes the qubit CSS polynomial pair\n      1+x+y+z and 1+xy+yz+zx. Generalized Haah codes alter the local\n      polynomial data or coefficient field; they contain this choice as a\n      specialization but are not aliases of every periodic Code 1 instance.\n      The target entry is pending.\n    refs: [haah2011local, tian2019generalized]\n  - type: dual_of\n    target: fractal_symmetry_model\n    how: >-\n      Ungauging the cubic code produces a spin model with fractal subsystem\n      symmetries, while gauging reverses the dictionary under the assumptions\n      of the construction. This is a representation-changing duality, not a\n      finite-depth logical gate on the same periodic Hilbert space. The target\n      entry is pending.\n    refs: [williamson2016fractal]\noperations:\n  - gate: \"conjugate periodic plane Pauli pair for odd L\"\n    mechanism: transversal\n    level: \"logical Pauli\"\n    cost: >-\n      one parallel physical-Pauli layer on a constructor-derived periodic\n      plane; the displayed X and Z representatives each have area scaling and\n      anticommute for odd L, while special even periods require a separately\n      tracked logical basis\n    origin:\n      kind: verified\n      method: \"constructor._plane_logicals commutation, row-space, and overlap checks\"\n  - gate: \"boundary creation, condensation, and defect manipulation\"\n    mechanism: switching\n    level: \"geometry-changing code operation\"\n    cost: >-\n      replace the periodic block by a boundary or defect geometry, specify\n      which excitations condense, measure the changed checks, decode the\n      transition, and track the resulting logical frame\n    origin: {kind: claimed, ref: aitchison2023boundaries}\n  - gate: \"ungauging to a fractal-symmetry model\"\n    mechanism: switching\n    level: \"representation and phase transformation\"\n    cost: >-\n      introduce the ungauging constraints and change the model's degrees of\n      freedom and symmetry description; this is not a universal gate on the\n      original fixed periodic code block\n    origin: {kind: claimed, ref: williamson2016fractal}\n",
    "version": "qec-atlas-card-v1"
  },
