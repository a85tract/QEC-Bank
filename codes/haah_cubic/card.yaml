        "description": "“No string logical operator” is a statement about bounded-width logical segments whose length can grow without bound. The proof deforms long candidate segments until their nontrivial part disconnects. Periodic plane and fractal logical operators remain, so replacing “no string” by “no logical” would reverse the content of the theorem.",
