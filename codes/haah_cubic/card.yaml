        "description": "Translation becomes multiplication by Laurent monomials, so the infinite stabilizer family is stored in two compact polynomial columns. A finite periodic instance imposes x^L=y^L=z^L=1 and expands every translate into binary CSS rows. Matrix rank then computes k for that particular L; it must not be replaced by a guessed smooth scaling law.",
