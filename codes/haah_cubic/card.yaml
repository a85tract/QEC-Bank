        "description": "At each cubic vertex, orbital A and orbital B receive different Pauli factors. For the X generator their supports are the monomials of 1+x+y+z and 1+xy+yz+zx. Spatial inversion followed by exchanging the orbitals gives the Z generator. Keeping the complete corner table is essential: the phrase “two checks per cube” also describes inequivalent models in the founding classification.",
