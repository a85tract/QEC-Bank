      {
        "description": "Local Pauli faults create bounded clusters of cube defects, but isolated fracton charge cannot be transported by an ordinary Pauli string. Error patterns and neutral clusters therefore organize recursively rather than as pairs joined by shortest paths, motivating the family-specific renormalization decoder.",
