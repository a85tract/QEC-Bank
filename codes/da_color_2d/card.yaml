      }
    ],
    "tier": "T2",
    "views": [
      {
        "description": "The constructor tracks the sign-free instantaneous stabilizer group and exports its independent Pauli rows at the declared reference round as a symplectic CheckMatrix. This R1 snapshot is executable, but it is not a substitute for the fault distance of the full schedule.",
        "origin": {
          "converter": "constructor._schedule + ISGTracker reference row space",
          "kind": "derived",
          "version": "v1"
        },
        "refs": [
          "davydova2024dynamic"
        ],
        "rung": "R1",
        "type": "reference-isg-checks"
      },
      {
        "description": "Put two qubits at every site of a finite triangular color substrate and add color-labelled docking sites where the Y boundary would otherwise require a high-weight coupling. Interlayer V measurements fold the two layers into one effective color-code frame; intralayer E measurements unfold them into two toric sectors. The exported coordinates separate the layers visually but are an incidence layout, not a metric claim.",
        "origin": {
          "converter": "constructor.SITE_COORDS + layer offsets + docking labels",
          "kind": "derived",
          "version": "v1"
        },
        "refs": [
          "davydova2024dynamic"
        ],
        "rung": "R2",
        "type": "doubled-patch-stack"
      },
      {
        "description": "Read the padded witness from t=0 through t=8. The first return to the vertical-measurement frame occurs only after the startup transient; at that reference round the sign-free ISG has one logical degree of freedom, and the same row space returns at the final displayed round. A four-move condensation motif is therefore not by itself the complete executable witness.",
        "origin": {
          "kind": "canonical"
        },
        "refs": [
          "davydova2024dynamic"
        ],
        "rung": "R3",
        "type": "padded-schedule-isg"
      },
      {
        "description": "V(P1P2) acts between layers at one site, while E_c(P_l) acts along a color-c edge inside layer l. Boundary singles and mixed interlayer Paulis replace the bulk rule where a logical string must terminate. Keeping site, layer, color, Pauli, and round as separate labels prevents a drawing color from being mistaken for a measurement flavor.",
        "origin": {
          "kind": "curated",
          "ref": "davydova2024dynamic"
        },
        "refs": [
          "davydova2024dynamic"
        ],
        "rung": "R3",
        "type": "measurement-class-dictionary"
      },
      {
        "description": "Stabilizer-row-space recurrence says that the code frame closes; it does not say that logical labels return trivially. The primary construction transports the Pauli-triangle representatives as X_L to Z_L, Z_L to Y_L, and Y_L to X_L, which is the logical SH action. The constructor marks this map curated rather than verified because sign-free ISG rank tracking cannot derive outcome-dependent logical transport.",
        "origin": {
          "kind": "curated",
          "ref": "davydova2024dynamic"
        },
        "refs": [
          "davydova2024dynamic",
          "aasen2022automorphism"
        ],
        "rung": "R5",
        "type": "logical-frame-automorphism"
      },
      {
        "description": "Error information is a product of measurement outcomes from several rounds. A data or measurement fault flips a pattern of spacetime detectors, and a decoder must compare histories modulo time-dependent gauge relations. Static color-code syndrome lookup and the distance of one exported ISG snapshot are therefore not protocol-level guarantees.",
        "origin": {
          "kind": "curated",
          "ref": "davydova2024dynamic"
        },
        "refs": [
          "davydova2024dynamic",
          "blackwell2025distance"
        ],
        "rung": "R3",
        "type": "spacetime-detectors"
      },
      {
        "description": "At the intermediate E-measurement frames, the doubled color substrate separates into toric-code sectors joined by the boundary prescription. Unfolding explains why the checks stay low weight and how logical strings survive each transition; it is a frame dictionary, not a claim that the time-dependent family is a static surface code.",
        "origin": {
          "kind": "curated",
          "ref": "kubica2015unfolding"
        },
        "refs": [
          "kubica2015unfolding",
          "davydova2024dynamic"
        ],
        "rung": "R5",
        "type": "unfolded-toric-sectors"
      },
      {
        "description": "A measurement quantum cellular automaton treats each round as a local causal update and exposes boundary information flow that an unordered stabilizer list erases. The QCA view is useful for comparing dynamic phases, while the literal Schedule remains the executable source for this entry.",
        "origin": {
          "kind": "curated",
          "ref": "aasen2023mqca"
        },
        "refs": [
          "aasen2023mqca"
        ],
        "rung": "R5",
