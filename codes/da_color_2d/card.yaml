    "text": "id: da_color_2d\nkind: family\nidentity:\n  canonical_name: \"Two-dimensional dynamic-automorphism color code\"\n  variant: \"Pauli-triangle phi_(rbg) protocol\"\n  aliases:\n    - \"2D DA color code\"\n    - \"dynamic automorphism color code\"\npresentation:\n  orienting_view: {status: available, kind: schedule}\n  guided_tour: {status: available}\neczoo:\n  status: mapped\n  zoo_id: da_color_2d\n  classification: exact-family\n  source:\n    repository_url: https://github.com/errorcorrectionzoo/eczoo_data\n    commit: b2437d9e2dc09284e04c66ef72ee81b7ed7bd129\n    retrieved_on: \"2026-08-05\"\n    path: codes/quantum/qubits/dynamic/floquet/2d/da_color_2d.yml\n    sha256: c93d49d299ad748ab4c5ff6e38b8be594a6316fdeae2b8dd8860f0382193db8b\n    page_url: https://errorcorrectionzoo.org/c/da_color_2d\n    blob_url: https://github.com/errorcorrectionzoo/eczoo_data/blob/b2437d9e2dc09284e04c66ef72ee81b7ed7bd129/codes/quantum/qubits/dynamic/floquet/2d/da_color_2d.yml\ndescription: >-\n  A dynamic-automorphism color code stores a color-code logical subsystem\n  while low-weight measurements repeatedly unfold a doubled color patch into\n  toric-code sectors and fold it back. The ordered history is the code: an\n  individual round exposes only one instantaneous stabilizer frame. This\n  entry fixes the complete padded Pauli-triangle protocol for the cyclic\n  color permutation. Its finite constructor verifies every measured Pauli,\n  the startup-to-reference ISG, and recurrence of the reference row space;\n  the induced logical Clifford frame remains a cited boundary because the\n  engine does not yet transport outcome-dependent logical representatives.\nclaim_gaps:\n  - {property: d, target: wanted:floquet-fault-distance}\nviews:\n  - rung: R1\n    type: reference-isg-checks\n    description: >-\n      The constructor tracks the sign-free instantaneous stabilizer group and\n      exports its independent Pauli rows at the declared reference round as a\n      symplectic CheckMatrix. This R1 snapshot is executable, but it is not a\n      substitute for the fault distance of the full schedule.\n    origin:\n      kind: derived\n      converter: \"constructor._schedule + ISGTracker reference row space\"\n      version: \"v1\"\n    refs: [davydova2024dynamic]\n  - rung: R2\n    type: doubled-patch-stack\n    description: >-\n      Put two qubits at every site of a finite triangular color substrate and\n      add color-labelled docking sites where the Y boundary would otherwise\n      require a high-weight coupling. Interlayer V measurements fold the two\n      layers into one effective color-code frame; intralayer E measurements\n      unfold them into two toric sectors. The exported coordinates separate\n      the layers visually but are an incidence layout, not a metric claim.\n    origin:\n      kind: derived\n      converter: \"constructor.SITE_COORDS + layer offsets + docking labels\"\n      version: \"v1\"\n    refs: [davydova2024dynamic]\n  - rung: R3\n    type: padded-schedule-isg\n    description: >-\n      Read the padded witness from t=0 through t=8. The first return to the\n      vertical-measurement frame occurs only after the startup transient; at\n      that reference round the sign-free ISG has one logical degree of\n      freedom, and the same row space returns at the final displayed round.\n      A four-move condensation motif is therefore not by itself the complete\n      executable witness.\n    origin: {kind: canonical}\n    refs: [davydova2024dynamic]\n  - rung: R3\n    type: measurement-class-dictionary\n    description: >-\n      V(P1P2) acts between layers at one site, while E_c(P_l) acts along a\n      color-c edge inside layer l. Boundary singles and mixed interlayer\n      Paulis replace the bulk rule where a logical string must terminate.\n      Keeping site, layer, color, Pauli, and round as separate labels prevents\n      a drawing color from being mistaken for a measurement flavor.\n    origin: {kind: curated, ref: davydova2024dynamic}\n    refs: [davydova2024dynamic]\n  - rung: R5\n    type: logical-frame-automorphism\n    description: >-\n      Stabilizer-row-space recurrence says that the code frame closes; it does\n      not say that logical labels return trivially. The primary construction\n      transports the Pauli-triangle representatives as X_L to Z_L, Z_L to\n      Y_L, and Y_L to X_L, which is the logical SH action. The constructor\n      marks this map curated rather than verified because sign-free ISG rank\n      tracking cannot derive outcome-dependent logical transport.\n    origin: {kind: curated, ref: davydova2024dynamic}\n    refs: [davydova2024dynamic, aasen2022automorphism]\n  - rung: R3\n    type: spacetime-detectors\n    description: >-\n      Error information is a product of measurement outcomes from several\n      rounds. A data or measurement fault flips a pattern of spacetime\n      detectors, and a decoder must compare histories modulo time-dependent\n      gauge relations. Static color-code syndrome lookup and the distance of\n      one exported ISG snapshot are therefore not protocol-level guarantees.\n    origin: {kind: curated, ref: davydova2024dynamic}\n    refs: [davydova2024dynamic, blackwell2025distance]\n  - rung: R5\n    type: unfolded-toric-sectors\n    description: >-\n      At the intermediate E-measurement frames, the doubled color substrate\n      separates into toric-code sectors joined by the boundary prescription.\n      Unfolding explains why the checks stay low weight and how logical\n      strings survive each transition; it is a frame dictionary, not a claim\n      that the time-dependent family is a static surface code.\n    origin: {kind: curated, ref: kubica2015unfolding}\n    refs: [kubica2015unfolding, davydova2024dynamic]\n  - rung: R5\n    type: measurement-qca\n    description: >-\n      A measurement quantum cellular automaton treats each round as a local\n      causal update and exposes boundary information flow that an unordered\n      stabilizer list erases. The QCA view is useful for comparing dynamic\n      phases, while the literal Schedule remains the executable source for\n      this entry.\n    origin: {kind: curated, ref: aasen2023mqca}\n    refs: [aasen2023mqca]\ncategories:\n  - {id: dynamical, origin: {kind: curated, ref: davydova2024dynamic}}\n  - {id: non-css, origin: {kind: verified}}\n  - {id: topological, origin: {kind: curated, ref: davydova2024dynamic}}\nrefs:\n  - davydova2024dynamic\n  - aasen2022automorphism\n  - bombin2006topological\n  - davydova2023css\n  - hastings2021dynamically\n  - aitchison2024competing\n  - blackwell2025distance\n  - tang2025floquet\n  - wootton2022plaquettes\n  - aasen2023mqca\n  - bombin2023unifying\n  - kubica2015unfolding\n  - bauer2025nonclifford\nparams:\n  patch: >-\n    Exact finite schedule witness. The only supported literal is\n    'table8-pauli-triangle-incidence-v1'; it fixes qubit order, edge colors,\n    boundary representatives, docking sites, and all padded rounds.\nvisual_instance: table8_pauli_triangle\ntier: T2\nfit:\n  platforms:\n    - local-two-qubit-parity-measurement-array\n    - layered-color-code-architecture\n  tasks:\n    - measurement-driven-Clifford-computation\n    - spacetime-error-correction-research\n    - dynamic-boundary-design\ndecoders:\n  - id: none-known\n    status: none-known\n    gap: {target: wanted:floquet-fault-distance}\n    noise: >-\n      the complete padded Pauli-triangle schedule with data faults,\n      measurement faults, boundary docking faults, and repeated gate cycles\n    notes: >-\n      The primary work constructs candidate bulk and boundary detectors but\n      leaves completeness at the Y boundary and a full numerical\n      fault-tolerance analysis open. No protocol-specific circuit-level\n      threshold or standard decoder was found in the search completed on\n      2026-08-09. General Floquet distance and decoherence frameworks do not\n      fill this exact-family benchmark.\n    refs: [davydova2024dynamic, blackwell2025distance, tang2025floquet]\nrealizations: []\nrelations:\n  - type: floquetification_of\n    target: color_code_2d\n    how: >-\n      The protocol begins and returns to an effective two-dimensional color\n      code, but uses an ordered low-weight measurement path through different\n      instantaneous frames. The relation targets the broader static family;\n      it does not identify this schedule with the existing 6.6.6 or 4.8.8\n      finite-boundary entries.\n    refs: [davydova2024dynamic, bombin2006topological]\n  - type: special_case_of\n    target: dynamic_automorphism\n    how: >-\n      This entry fixes the two-dimensional color substrate, Pauli-triangle\n      boundary, and phi_(rbg) schedule inside the wider construction class of\n      measurement paths that realize topological automorphisms.\n    refs: [davydova2024dynamic, aasen2022automorphism]\n  - type: same_bulk_phase_as\n    target: color_666\n    how: >-\n      The reference frame has color-code topological order, while its doubled\n      microscopic qubits, Pauli boundaries, docking sites, and time-dependent\n      checks differ from the static three-color-boundary 6.6.6 constructor.\n      Bulk phase does not transfer finite parameters or decoder results.\n    refs: [davydova2024dynamic, bombin2006topological]\noperations:\n  - gate: \"SH / cyclic logical-Pauli permutation\"\n    mechanism: measurement-based\n    level: \"single-qubit Clifford frame\"\n    cost: >-\n      execute the complete padded phi_(rbg) Pauli-triangle sequence, retain\n      all measurement outcomes needed for detectors, and update the logical\n      Pauli frame; the finite constructor verifies the schedule and ISG\n      recurrence but not the cited outcome-dependent logical transport\n    origin: {kind: claimed, ref: davydova2024dynamic}\n  - gate: \"full logical Clifford group on a stack of Pauli triangles\"\n    mechanism: measurement-based\n    level: \"multi-qubit Clifford protocol\"\n    cost: >-\n      compose the two single-triangle color-permutation generators with the\n      separate double-triangle entangling sequence; the latter can require a\n      three-body boundary measurement and is not exported by this single-\n      triangle constructor\n    origin: {kind: claimed, ref: davydova2024dynamic}\n",
