        "type": "floquetification_of"
      },
      {
        "how": "This entry fixes the two-dimensional color substrate, Pauli-triangle boundary, and phi_(rbg) schedule inside the wider construction class of measurement paths that realize topological automorphisms.",
        "refs": [
          "davydova2024dynamic",
          "aasen2022automorphism"
        ],
        "target": "dynamic_automorphism",
        "type": "special_case_of"
      },
      {
        "how": "The reference frame has color-code topological order, while its doubled microscopic qubits, Pauli boundaries, docking sites, and time-dependent checks differ from the static three-color-boundary 6.6.6 constructor. Bulk phase does not transfer finite parameters or decoder results.",
        "refs": [
          "davydova2024dynamic",
