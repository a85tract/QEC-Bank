    "description": "A dynamic-automorphism color code stores a color-code logical subsystem while low-weight measurements repeatedly unfold a doubled color patch into toric-code sectors and fold it back. The ordered history is the code: an individual round exposes only one instantaneous stabilizer frame. This entry fixes the complete padded Pauli-triangle protocol for the cyclic color permutation. Its finite constructor verifies every measured Pauli, the startup-to-reference ISG, and recurrence of the reference row space; the induced logical Clifford frame remains a cited boundary because the engine does not yet transport outcome-dependent logical representatives.",
