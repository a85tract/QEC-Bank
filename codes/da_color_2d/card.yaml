    "relations": [
      {
        "how": "The protocol begins and returns to an effective two-dimensional color code, but uses an ordered low-weight measurement path through different instantaneous frames. The relation targets the broader static family; it does not identify this schedule with the existing 6.6.6 or 4.8.8 finite-boundary entries.",
        "refs": [
